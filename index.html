<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Messenger</title>
<style>
  :root{
    --bg:#eef1f5; --card:#fff; --text:#18202a; --muted:#7b8490;
    --border:#e5e8ec; --border2:#dce1e7; --msg:#e3e6ea; --msg-out:#c9ccd1;
    --msgs-bg:#f7f9fb; --input:#fff; --hover:#edf3ff; --me-bar:#f4f7fc;
    --primary:#3678e8; --green:#34a853; --red:#ea4335;
  }
  html[data-theme="dark"]{
    --bg:#0e1621; --card:#17212b; --text:#e9eef5; --muted:#8fa3b8;
    --border:#243447; --border2:#2b3d52; --msg:#1f2c3a; --msg-out:#2b5278;
    --msgs-bg:#0e1621; --input:#1f2c3a; --hover:#1e2c3c; --me-bar:#1e2c3c;
    --primary:#5288c1; --green:#34a853; --red:#ea4335;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;font:15px system-ui;background:var(--bg);color:var(--text);overscroll-behavior:none}
  button{font:inherit;cursor:pointer}
  input{font:inherit}
  .card{max-width:420px;margin:10vh auto;background:var(--card);padding:28px;border-radius:18px;box-shadow:0 10px 40px #0001}
  .field{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border2);margin:6px 0;background:var(--input);color:var(--text)}
  .primary{width:100%;padding:12px;border-radius:10px;border:0;background:var(--primary);color:#fff;margin:6px 0}
  .link{border:0;background:none;color:var(--primary);padding:0;margin:0}
  .error{color:#c33;min-height:20px;margin-top:8px}
  .app{height:100dvh;display:flex;max-width:1100px;margin:auto;background:var(--card)}
  .side{width:320px;border-right:1px solid var(--border);padding:18px;display:flex;flex-direction:column;min-width:0;background:var(--card)}
  .side h2{margin:0;font-size:20px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
  .tabs{display:flex;gap:6px;margin-bottom:10px}
  .tabs button{flex:1;padding:8px;border:0;background:var(--me-bar);border-radius:10px;font-size:14px;font-weight:600;color:var(--muted)}
  .tabs button.active{background:var(--primary);color:#fff}
  .users{flex:1;overflow:auto;margin-top:6px;min-height:0;-webkit-overflow-scrolling:touch}
  .user{padding:10px;border-radius:10px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:10px;position:relative;color:var(--text)}
  .user:active{background:var(--hover)}
  .user.active{background:var(--hover)}
  .user b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .user .dot{position:absolute;left:33px;bottom:7px;width:11px;height:11px;border-radius:50%;background:#b8c0c8;border:2px solid var(--card)}
  .user .dot.on{background:#34c759}
  .user .g-icon{width:32px;height:32px;border-radius:50%;background:#6a5bff33;display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
  .avatar{width:36px;height:36px;border-radius:50%;background:var(--border2);display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto;overflow:hidden;background-size:cover;background-position:center}
  .avatar.small{width:32px;height:32px;font-size:18px}
  .me-bar{display:flex;align-items:center;gap:10px;padding:10px;background:var(--me-bar);border-radius:12px;margin-bottom:10px}
  .me-bar .name{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .me-bar .edit{font-size:13px}
  .chat{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--card)}
  .head{padding:12px 14px;border-bottom:1px solid var(--border);font-weight:700;display:flex;align-items:center;gap:8px;min-height:56px}
  .head .row{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
  .head .col{display:flex;flex-direction:column;min-width:0}
  .head .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .head .sub{font-size:12px;color:var(--muted);font-weight:400}
  .head button.back{display:none;border:0;background:none;font-size:22px;padding:0 6px 0 0;cursor:pointer;line-height:1;color:var(--text)}
  .head button.call{border:0;background:var(--green);color:#fff;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;flex:0 0 auto}
  .msgs{flex:1;overflow:auto;padding:16px;background:var(--msgs-bg);min-height:0;-webkit-overflow-scrolling:touch}
  .brow{display:flex;margin:6px 0}
  .brow.out{justify-content:flex-end}
  .b{max-width:80%;padding:8px 12px;border-radius:15px;background:var(--msg);color:var(--text);word-wrap:break-word;white-space:pre-wrap;font-size:15px;line-height:1.35;position:relative;cursor:pointer}
  .b.out{background:var(--msg-out)}
  .b .sender{font-size:12px;color:var(--primary);font-weight:600;margin-bottom:3px}
  .b .reply{font-size:13px;color:var(--muted);border-left:3px solid var(--primary);padding-left:6px;margin-bottom:4px;white-space:normal}
  .b .reply b{color:var(--primary);display:block;font-size:12px}
  .b .deleted{font-style:italic;color:var(--muted);font-size:14px}
  .b .edited{font-size:11px;color:var(--muted);margin-left:4px}
  .b .meta{font-size:11px;color:var(--muted);margin-top:3px;display:flex;gap:4px;align-items:center;justify-content:flex-end}
  .b .meta .check{color:#5aa9ff}
  .b audio{max-width:100%;margin-top:2px;display:block}
  .b img.att{max-width:100%;border-radius:10px;margin-top:2px;display:block}
  .b .reacts{display:flex;gap:3px;margin-top:3px;flex-wrap:wrap}
  .b .reacts span{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:1px 6px;font-size:12px}
  .compose-wrap{border-top:1px solid var(--border);background:var(--card)}
  .reply-preview{padding:8px 12px;background:var(--me-bar);border-left:3px solid var(--primary);display:flex;justify-content:space-between;align-items:center;font-size:13px}
  .reply-preview .x{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 4px}
  .compose{display:flex;padding:10px;gap:8px;align-items:center;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  .compose input{flex:1;padding:12px 14px;border:1px solid var(--border2);border-radius:20px;min-width:0;font-size:16px;background:var(--input);color:var(--text)}
  .compose button.icon{width:42px;height:42px;background:var(--me-bar);color:var(--text);border:0;border-radius:50%;font-size:18px;flex:0 0 auto}
  .compose button.send{width:46px;height:46px;background:var(--primary);color:#fff;border:0;border-radius:50%;font-size:18px;flex:0 0 auto}
  .compose button.rec{background:var(--red);color:#fff}
  .emoji-panel{display:none;padding:8px 10px;background:var(--card);border-top:1px solid var(--border);flex-wrap:wrap;gap:4px;max-height:180px;overflow:auto}
  .emoji-panel.open{display:flex}
  .emoji-panel button{background:var(--me-bar);border:0;border-radius:8px;font-size:22px;padding:6px;cursor:pointer;line-height:1}
  .typing{font-size:12px;color:var(--muted);padding:0 16px 6px;height:18px}
  .muted{color:var(--muted);padding:10px}
  .overlay{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
  .modal{background:var(--card);color:var(--text);border-radius:16px;padding:22px;max-width:440px;width:100%;text-align:center;max-height:88vh;overflow:auto}
  .modal h3{margin:0 0 12px;font-size:18px}
  .modal button{padding:10px 20px;margin:6px;border-radius:10px;border:0;cursor:pointer;font-size:15px}
  .modal .accept{background:var(--green);color:#fff}
  .modal .reject{background:var(--red);color:#fff}
  .modal input[type=range]{width:100%;margin-top:12px}
  .modal input[type=text],.modal input[type=file]{width:100%;padding:10px;border:1px solid var(--border2);border-radius:10px;margin:6px 0;font:inherit;background:var(--input);color:var(--text)}
  .modal .row-btns{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:8px}
  .react-popup{position:fixed;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:4px 6px;display:flex;gap:2px;box-shadow:0 6px 20px #0004;z-index:1100}
  .react-popup button{background:none;border:0;font-size:22px;padding:4px 6px;cursor:pointer;border-radius:8px}
  .ctx-menu{position:fixed;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:4px;box-shadow:0 6px 20px #0004;z-index:1200;min-width:140px}
  .ctx-menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:8px;font-size:14px;cursor:pointer;color:var(--text)}
  .ctx-menu button:hover{background:var(--hover)}
  .member-list{max-height:200px;overflow:auto;text-align:left;border:1px solid var(--border);border-radius:10px;padding:6px;margin:8px 0}
  .member-list label{display:flex;align-items:center;gap:8px;padding:6px;cursor:pointer;border-radius:8px}
  .member-list label:hover{background:var(--hover)}
  @media (max-width: 700px){
    .app{max-width:none;position:relative;overflow:hidden}
    .side{width:100%;border-right:0;padding:14px;padding-top:calc(14px + env(safe-area-inset-top))}
    .chat{position:absolute;inset:0;transform:translateX(100%);transition:transform .22s ease;z-index:5;background:var(--card)}
    .app.chat-open .chat{transform:translateX(0)}
    .head button.back{display:block}
    .b{max-width:85%}
    .card{margin:6vh 14px;padding:20px}
    .side h2{font-size:18px}
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";
const api = async (u, o = {}) => {
  const r = await fetch(u, {
    headers: {'Content-Type':'application/json'},
    credentials: 'same-origin',
    ...o
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw Error(d.error || 'Ошибка');
  return d;
};

const state = { me: null, peer: null, group: null, tab: 'users', timer: null, typingSent: 0, replyTo: null, editId: null };
const root = document.getElementById('root');
let appEl = null;
let typingLine = null;
let usersBoxRef = null;
let groupsBoxRef = null;
let msgsBoxRef = null;
let chatHeadRef = null;

const EMOJI_LIST = ('😀 😃 😄 😁 😆 😅 😂 🤣 😊 😇 🙂 🙃 😉 😌 😍 🥰 😘 😗 😙 😚 😋 😜 🤪 😝 🤗 🤔 🤨 😐 😑 😶 🙄 😏 😣 😥 😮 🤐 😯 😪 😴 😛 😕 😟 🙁 😞 😔 😢 😭 😤 😠 😡 🤬 🤯 😳 🥺 😱 😨 😰 😓 😩 😫 🥱 🤤 👋 👍 👎 👌 ✌️ 🤞 🤟 🤘 🤙 👈 👉 👆 👇 ☝️ ✋ 🤚 🖐️ 🖖 👏 🙌 👐 🤲 🤝 🙏 💪 ❤️ 🧡 💛 💚 💙 💜 🖤 🤍 🤎 💔 ❣️ 💕 💞 💓 💗 💖 💘 💝 💟 🔥 ✨ 🎉 🎊 🎁 🎈').split(/\s+/).filter(Boolean);

const REACT_LIST = ['👍','❤️','😂','🔥','😮','😢'];

function el(tag, props, children){
  const n = document.createElement(tag);
  if (props) for (const k in props){
    if (k === 'class') n.className = props[k];
    else if (k === 'text') n.textContent = props[k];
    else if (k === 'on') for (const ev in props[k]) n.addEventListener(ev, props[k][ev]);
    else if (k in n) n[k] = props[k];
    else n.setAttribute(k, props[k]);
  }
  if (children) for (const c of [].concat(children)){
    if (c == null || c === false) continue;
    n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return n;
}
function clear(n){ while (n.firstChild) n.removeChild(n.firstChild); }
function makeAvatar(u, size){
  const d = el('div', { class: 'avatar' + (size ? ' ' + size : '') });
  const a = (u && u.avatar) || '';
  if (a.startsWith('data:')) d.style.backgroundImage = 'url("' + a + '")';
  else if (a) d.textContent = a;
  else d.textContent = '👤';
  return d;
}
function isMobile(){ return window.matchMedia('(max-width: 700px)').matches; }
function fmtTime(ts){
  const d = new Date((ts || 0) * 1000);
  const h = String(d.getHours()).padStart(2,'0');
  const m = String(d.getMinutes()).padStart(2,'0');
  return h + ':' + m;
}

/* ======== ТЁМНАЯ ТЕМА ======== */
function applyTheme(){
  const t = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', t);
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  localStorage.setItem('theme', next);
  document.documentElement.setAttribute('data-theme', next);
}
applyTheme();

/* ======== АВТОРИЗАЦИЯ ======== */
function renderAuth(){
  clear(root);
  appEl = null;
  let reg = true;
  const themeBtn = el('button', {class:'link', type:'button', text:'🌓', style:{float:'right', fontSize:'20px'}});
  themeBtn.addEventListener('click', () => { toggleTheme(); });
  const modeEl = el('p', {class:'muted', style:{padding:'0'}, text:'Регистрация'});
  const inpU = el('input', {class:'field', placeholder:'Имя пользователя', autocomplete:'username'});
  const inpP = el('input', {class:'field', type:'password', placeholder:'Пароль', autocomplete:'current-password'});
  const errEl = el('div', {class:'error'});
  const btnGo = el('button', {class:'primary', type:'button', text:'Зарегистрироваться'});
  const btnSwap = el('button', {class:'link', type:'button', text:'У меня уже есть аккаунт'});

  btnSwap.addEventListener('click', () => {
    reg = !reg;
    modeEl.textContent = reg ? 'Регистрация' : 'Вход';
    btnGo.textContent = reg ? 'Зарегистрироваться' : 'Войти';
    btnSwap.textContent = reg ? 'У меня уже есть аккаунт' : 'Создать аккаунт';
    errEl.textContent = '';
  });
  btnGo.addEventListener('click', async () => {
    errEl.textContent = '';
    try {
      const d = await api(reg ? '/api/register' : '/api/login', {
        method:'POST',
        body: JSON.stringify({ username: inpU.value.trim(), password: inpP.value })
      });
      state.me = { id: d.id, username: d.username, avatar: d.avatar || '' };
      renderApp();
    } catch(e){ errEl.textContent = e.message; }
  });
  inpU.addEventListener('keydown', e => { if (e.key === 'Enter') inpP.focus(); });
  inpP.addEventListener('keydown', e => { if (e.key === 'Enter') btnGo.click(); });
  root.appendChild(el('div', {class:'card'}, [
    themeBtn,
    el('h1', {text:'Messenger'}), modeEl, inpU, inpP, btnGo, btnSwap, errEl
  ]));
}
/* ======== ОСНОВНОЙ ЭКРАН ======== */
async function renderApp(){
  clear(root);
  const usersBox = el('div', {class:'users'});
  usersBoxRef = usersBox;
  const groupsBox = el('div', {class:'users'});
  groupsBox.style.display = 'none';
  groupsBoxRef = groupsBox;

  const inpSearch = el('input', {class:'field', placeholder:'Поиск', autocomplete:'off'});
  const tabUsers = el('button', {type:'button', text:'Люди', class:'active'});
  const tabGroups = el('button', {type:'button', text:'Группы'});
  tabUsers.addEventListener('click', () => window.__switchTab('users'));
  tabGroups.addEventListener('click', () => window.__switchTab('groups'));
  const tabs = el('div', {class:'tabs'}, [tabUsers, tabGroups]);

  const headTitle = el('div', {class:'name', text:'Выберите чат'});
  const headSub = el('div', {class:'sub', text:''});
  const headCol = el('div', {class:'col'}, [headTitle, headSub]);
  const headAva = el('div');
  const inpText = el('input', {placeholder:'Сообщение...', disabled:true, autocomplete:'off'});

  const btnBack = el('button', {class:'back', type:'button', text:'←', title:'Назад'});
  btnBack.addEventListener('click', () => {
    if (appEl) appEl.classList.remove('chat-open');
    state.peer = null; state.group = null; state.replyTo = null; state.editId = null;
    headTitle.textContent = 'Выберите чат';
    headSub.textContent = '';
    clear(headAva);
    inpText.disabled = true;
    refreshReplyPreview();
  });

  const btnBlock = el('button', {class:'call', text:'🚫', type:'button', title:'Заблокировать'});
  btnBlock.style.background = '#ea4335';
  btnBlock.addEventListener('click', blockCurrentPeer);

  const btnCall = el('button', {class:'call', text:'📞', type:'button', title:'Позвонить'});
  btnCall.addEventListener('click', startCall);

  const btnTheme = el('button', {class:'call', text:'🌓', type:'button', title:'Тема'});
  btnTheme.style.background = '#5a5a6a';
  btnTheme.addEventListener('click', toggleTheme);

  const headRow = el('div', {class:'row'}, [headAva, headCol]);
  const chatHead = el('div', {class:'head'}, [btnBack, headRow, btnTheme, btnBlock, btnCall]);
  chatHeadRef = chatHead;
  const msgsBox = el('div', {class:'msgs'});
  msgsBoxRef = msgsBox;
  typingLine = el('div', {class:'typing', text:''});

  const replyPreview = el('div', {class:'reply-preview'});
  replyPreview.style.display = 'none';
  const replyText = el('div', {class:'reply-text', style:{flex:'1', minWidth:'0', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap'}});
  const replyX = el('button', {class:'x', type:'button', text:'×'});
  replyX.addEventListener('click', () => { state.replyTo = null; state.editId = null; refreshReplyPreview(); });
  replyPreview.appendChild(replyText);
  replyPreview.appendChild(replyX);

  const btnSend = el('button', {class:'send', type:'button', text:'➤'});
  const btnSmile = el('button', {class:'icon', type:'button', text:'😊'});
  const btnMic = el('button', {class:'icon', type:'button', text:'🎤'});

  function refreshReplyPreview(){
    if (state.replyTo){
      replyPreview.style.display = 'flex';
      replyText.textContent = 'Ответ: ' + (state.replyTo.sender_name || state.replyTo.username || '') + ' — ' + state.replyTo.text.slice(0, 60);
    } else if (state.editId){
      replyPreview.style.display = 'flex';
      replyText.textContent = 'Редактирование сообщения';
    } else {
      replyPreview.style.display = 'none';
    }
  }
  window.__refreshReplyPreview = refreshReplyPreview;

  const emojiPanel = el('div', {class:'emoji-panel'});
  for (const e of EMOJI_LIST){
    const b = el('button', {type:'button', text:e});
    b.addEventListener('click', () => { inpText.value += e; inpText.focus(); });
    emojiPanel.appendChild(b);
  }
  btnSmile.addEventListener('click', () => emojiPanel.classList.toggle('open'));

  let mediaRec = null, chunks = [], recStream = null, recMime = '';
  let recTimer = null, recSeconds = 0;
  function pickMime(){
    const c = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus','audio/ogg'];
    for (const t of c){ try { if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t; } catch(e){} }
    return '';
  }
  btnMic.addEventListener('click', async () => {
    if (mediaRec && mediaRec.state === 'recording'){
      try { mediaRec.requestData(); } catch(e){}
      clearInterval(recTimer);
      btnMic.textContent = '🎤';
      btnMic.classList.remove('rec');
      mediaRec.stop();
      return;
    }
    if (!navigator.mediaDevices || !window.MediaRecorder){ alert('Этот браузер не поддерживает запись звука'); return; }
    try {
      recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      chunks = [];
      recMime = pickMime();
      mediaRec = recMime ? new MediaRecorder(recStream, { mimeType: recMime }) : new MediaRecorder(recStream);
      mediaRec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
      mediaRec.onstop = () => {
        recStream.getTracks().forEach(t => t.stop());
        clearInterval(recTimer);
        btnMic.textContent = '🎤';
        btnMic.classList.remove('rec');
        const type = (mediaRec && mediaRec.mimeType) || recMime || 'audio/webm';
        const blob = new Blob(chunks, { type });
        if (blob.size < 500) return;
        const reader = new FileReader();
        reader.onload = async () => {
          try {
            if (state.group){
              await api('/api/groups/' + state.group.id + '/messages', { method:'POST', body: JSON.stringify({ text: String(reader.result), kind: 'voice' }) });
            } else if (state.peer){
              await api('/api/messages', { method:'POST', body: JSON.stringify({ receiver: state.peer.id, text: String(reader.result), kind: 'voice' }) });
            }
            await refreshMessages();
          } catch(e){ alert(e.message); }
        };
        reader.readAsDataURL(blob);
      };
      mediaRec.start(1000);
      recSeconds = 0;
      recTimer = setInterval(() => { recSeconds++; btnMic.textContent = '⏹ ' + recSeconds + 'с'; }, 1000);
      btnMic.classList.add('rec');
    } catch(e){ alert('Нет доступа к микрофону: ' + e.message); }
  });

  const btnOut = el('button', {class:'link', type:'button', text:'Выйти'});
  btnOut.addEventListener('click', async () => {
    await api('/api/logout', { method:'POST' }).catch(()=>{});
    state.me = null; state.peer = null; state.group = null;
    clearInterval(state.timer); state.timer = null;
    renderAuth();
  });
  const meAva = makeAvatar(state.me, '', () => openProfileModal());
  const meName = el('div', {class:'name', text: state.me.username});
  const meEdit = el('button', {class:'link edit', type:'button', text:'Профиль'});
  meEdit.addEventListener('click', openProfileModal);
  const meBar = el('div', {class:'me-bar'}, [meAva, meName, meEdit]);

  inpSearch.addEventListener('input', () => {
    if (state.tab === 'users') loadUsers(inpSearch.value);
    else loadGroups(inpSearch.value);
  });
  btnSend.addEventListener('click', () => sendMessage(inpText));
  inpText.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); sendMessage(inpText); } });
  inpText.addEventListener('input', () => {
    if (!state.peer) return;
    const now = Date.now();
    if (now - state.typingSent > 2000){
      state.typingSent = now;
      api('/api/typing', { method:'POST', body: JSON.stringify({ to: state.peer.id }) }).catch(()=>{});
    }
  });

  appEl = el('div', {class:'app'}, [
    el('aside', {class:'side'}, [
      el('div', {class:'top'}, [el('h2', {text:'Чаты'}), btnOut]),
      meBar, tabs, inpSearch, usersBox, groupsBox
    ]),
    el('main', {class:'chat'}, [
      chatHead, msgsBox, typingLine,
      el('div', {class:'compose-wrap'}, [
        replyPreview,
        emojiPanel,
        el('div', {class:'compose'}, [btnSmile, inpText, btnMic, btnSend])
      ])
    ])
  ]);
  root.appendChild(appEl);

  window.__switchTab = function(t){
    state.tab = t;
    if (t === 'users'){ tabUsers.classList.add('active'); tabGroups.classList.remove('active'); usersBox.style.display = ''; groupsBox.style.display = 'none'; loadUsers(''); }
    else { tabGroups.classList.add('active'); tabUsers.classList.remove('active'); groupsBox.style.display = ''; usersBox.style.display = 'none'; loadGroups(''); }
  };

  loadUsers('');

  clearInterval(state.timer);
  state.timer = setInterval(async () => {
    if (state.peer || state.group){
      await refreshMessages();
      if (state.peer){
        try { const d = await api('/api/typing?who=' + state.peer.id); typingLine.textContent = d.typing ? 'печатает…' : ''; } catch(e){}
        try {
          const u = await api('/api/users?q=' + encodeURIComponent(state.peer.username));
          const found = (u.users || []).find(x => x.id === state.peer.id);
          if (found) headSub.textContent = found.online ? 'онлайн' : 'не в сети';
        } catch(e){}
      }
    }
  }, 2000);
}

    if (!d.users.length){ usersBoxRef.appendChild(el('div', {class:'muted', text:'Никого не найдено'})); return; }

async function refreshMessages(){
  try {
    if (state.group){
      const d = await api('/api/groups/' + state.group.id + '/messages');
      renderList(d.messages, true);
    } else if (state.peer){
      const d = await api('/api/messages/' + state.peer.id);
      renderList(d.messages, false);
    }
  } catch(e){ console.error(e); }
}

function renderList(list, isGroup){
  clear(msgsBoxRef);
  if (!list.length){ msgsBoxRef.appendChild(el('div', {class:'muted', text:'Сообщений пока нет'})); return; }
  for (const m of list) msgsBoxRef.appendChild(renderMessage(m, isGroup));
  msgsBoxRef.scrollTop = msgsBoxRef.scrollHeight;
}

function renderMessage(m, isGroup){
  const out = m.sender === state.me.id;
  const b = el('div', {class: 'b' + (out ? ' out' : '')});
  if (isGroup && !out && m.sender_name) b.appendChild(el('div', {class:'sender', text: m.sender_name}));

  if (m.reply_to && m.reply_text){
    const rq = el('div', {class:'reply'});
    rq.appendChild(el('b', {text: m.reply_name || ''}));
    rq.appendChild(document.createTextNode(m.reply_text.slice(0, 80)));
    b.appendChild(rq);
  }

  if (m.deleted){
    b.appendChild(el('span', {class:'deleted', text:'сообщение удалено'}));
  } else if (m.kind === 'voice'){
    b.appendChild(el('audio', {controls:true, src: m.text}));
  } else if (m.kind === 'image'){
    b.appendChild(el('img', {class:'att', src: m.text}));
  } else {
    b.appendChild(document.createTextNode(m.text));
  }

  const meta = el('div', {class:'meta'});
  meta.appendChild(document.createTextNode(fmtTime(m.created)));
  if (m.edited) meta.appendChild(el('span', {class:'edited', text:'изм.'}));
  if (out && !isGroup) meta.appendChild(el('span', {class:'check', text: m.read_at ? '✓✓' : '✓'}));
  b.appendChild(meta);

  if (m.reactions && m.reactions.length){
    const rw = el('div', {class:'reacts'});
    for (const r of m.reactions) rw.appendChild(el('span', {text: r.emoji}));
    b.appendChild(rw);
  }

  b.addEventListener('contextmenu', (e) => { e.preventDefault(); showCtxMenu(e.clientX, e.clientY, m, out, isGroup); });
  let touchT;
  b.addEventListener('touchstart', () => { touchT = setTimeout(() => showCtxMenu(100, 200, m, out, isGroup), 600); });
  b.addEventListener('touchend', () => clearTimeout(touchT));

  return el('div', {class:'brow' + (out ? ' out' : '')}, [b]);
}

function showCtxMenu(x, y, m, out, isGroup){
  document.querySelectorAll('.ctx-menu').forEach(n => n.remove());
  const menu = el('div', {class:'ctx-menu'});
  menu.style.left = Math.max(8, Math.min(x, window.innerWidth - 160)) + 'px';
  menu.style.top = Math.max(8, y) + 'px';

  const btnReply = el('button', {type:'button', text:'↩ Ответить'});
  btnReply.addEventListener('click', () => {
    state.replyTo = { id: m.id, text: m.text, sender_name: m.sender_name || (out ? state.me.username : (state.peer ? state.peer.username : '')) };
    state.editId = null;
    if (window.__refreshReplyPreview) window.__refreshReplyPreview();
    menu.remove();
    const inp = document.querySelector('.compose input');
    if (inp) inp.focus();
  });
  menu.appendChild(btnReply);

  const btnReact = el('button', {type:'button', text:'👍 Реакция'});
  btnReact.addEventListener('click', () => { menu.remove(); showReactPopup(x, y, m); });
  menu.appendChild(btnReact);

  if (out && !m.deleted){
    const btnEdit = el('button', {type:'button', text:'✏ Изменить'});
    btnEdit.addEventListener('click', () => {
      state.editId = m.id; state.replyTo = null;
      if (window.__refreshReplyPreview) window.__refreshReplyPreview();
      const inp = document.querySelector('.compose input');
      if (inp){ inp.value = m.text; inp.focus(); }
      menu.remove();
    });
    menu.appendChild(btnEdit);

    const btnDel = el('button', {type:'button', text:'🗑 Удалить', style:{color:'#ea4335'}});
    btnDel.addEventListener('click', async () => {
      try {
        if (isGroup){
          await api('/api/groups/' + state.group.id + '/messages/' + m.id + '/delete', { method:'POST' });
        } else {
          await api('/api/messages/' + m.id + '/delete', { method:'POST' });
        }
        menu.remove();
        await refreshMessages();
      } catch(e){ alert(e.message); }
    });
    menu.appendChild(btnDel);
  }

  document.body.appendChild(menu);
  setTimeout(() => { document.addEventListener('click', function h(){ menu.remove(); document.removeEventListener('click', h); }); }, 0);
}

function showReactPopup(x, y, m){
  document.querySelectorAll('.react-popup').forEach(n => n.remove());
  const p = el('div', {class:'react-popup'});
  p.style.left = Math.max(8, x - 100) + 'px';
  p.style.top = Math.max(8, y - 50) + 'px';
  for (const e of REACT_LIST){
    const b = el('button', {type:'button', text:e});
    b.addEventListener('click', async () => {
      await api('/api/react', { method:'POST', body: JSON.stringify({ message_id: m.id, emoji: e })});
      p.remove();
      await refreshMessages();
    });
    p.appendChild(b);
  }
  document.body.appendChild(p);
  setTimeout(() => { document.addEventListener('click', function h(){ p.remove(); document.removeEventListener('click', h); }); }, 0);
}

async function sendMessage(inpText){
  const text = inpText.value.trim();
  if (!text) return;
  try {
    if (state.editId){
      if (state.group){
        await api('/api/groups/' + state.group.id + '/messages/' + state.editId + '/edit', { method:'POST', body: JSON.stringify({ text })});
      } else {
        await api('/api/messages/' + state.editId + '/edit', { method:'POST', body: JSON.stringify({ text })});
      }
      state.editId = null;
      inpText.value = '';
      if (window.__refreshReplyPreview) window.__refreshReplyPreview();
      await refreshMessages();
      return;
    }
    const payload = { text, kind: 'text' };
    if (state.replyTo) payload.reply_to = state.replyTo.id;
    if (state.group){
      await api('/api/groups/' + state.group.id + '/messages', { method:'POST', body: JSON.stringify(payload) });
    } else if (state.peer){
      payload.receiver = state.peer.id;
      await api('/api/messages', { method:'POST', body: JSON.stringify(payload) });
    } else { return; }
    inpText.value = '';
    state.replyTo = null;
    if (window.__refreshReplyPreview) window.__refreshReplyPreview();
    await refreshMessages();
  } catch(e){ alert(e.message); }
}

/* ======== ЗВОНКИ ======== */
const call = { active:false, pc:null, localStream:null, remoteAudio:null, room:null, role:null, pollTimer:null, modal:null };
let offerHandled = false;

function canCall(){ return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.RTCPeerConnection); }
function getIceServers(){ return [ { urls:'stun:stun.l.google.com:19302' }, { urls:'stun:stun1.l.google.com:19302' } ]; }
function newPc(){
  const pc = new RTCPeerConnection({ iceServers: getIceServers() });
  pc.onicecandidate = (ev) => { if (ev.candidate) postSignal({ type:'ice', candidate: ev.candidate.toJSON() }); };
  pc.ontrack = (ev) => {
    if (!call.remoteAudio){ call.remoteAudio = new Audio(); call.remoteAudio.autoplay = true; }
    call.remoteAudio.srcObject = ev.streams[0];
    call.remoteAudio.play().catch(()=>{});
  };
  pc.oniceconnectionstatechange = () => {
    const s = pc.iceConnectionState;
    if (s === 'connected' || s === 'completed') updateModal('В разговоре');
    if (s === 'disconnected' || s === 'failed' || s === 'closed') endCall(true);
  };
  return pc;
}

async function startCall(){
  if (!state.peer) return alert('Звонки только с людьми');
  if (call.active) return alert('Звонок уже идёт');
  if (!canCall()) return alert('Этот браузер не поддерживает звонки');
  offerHandled = false;
  call.room = Math.random().toString(36).substring(2, 10);
  call.role = 'caller'; call.active = true;
  try { call.localStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch(e){ alert('Нет доступа к микрофону: ' + e.message); call.active = false; return; }
  call.pc = newPc();
  call.localStream.getTracks().forEach(t => call.pc.addTrack(t, call.localStream));
  const offer = await call.pc.createOffer();
  await call.pc.setLocalDescription(offer);
  await postSignal({ type:'offer', sdp: offer.sdp });
  showCallModal('Ожидание ответа...', ['end']);
  try { await api('/api/call/invite', { method:'POST', body: JSON.stringify({ to: state.peer.id, room: call.room })}); } catch(e){}
  startPolling();
}

setInterval(async () => {
  if (!state.me || call.active) return;
  try {
    const r = await fetch('/api/call/incoming', { credentials:'same-origin' });
    const d = await r.json();
    if (d.invite){
      call.room = d.invite.room; call.role = 'callee'; offerHandled = false;
      showCallModal('Входящий звонок от ' + d.invite.fromName, ['accept', 'reject']);
    }
  } catch(e){}
}, 2000);

function startPolling(){
  clearInterval(call.pollTimer);
  const seen = new Set();
  call.pollTimer = setInterval(async () => {
    if (!call.active || !call.room) return;
    try {
      const r = await fetch('/api/signal/' + call.room, { credentials:'same-origin' });
      const d = await r.json();
      if (!d.items || !d.items.length) return;
      for (const sig of d.items){
        const key = JSON.stringify(sig).slice(0, 200);
        if (seen.has(key)) continue;
        seen.add(key);
        await handleSignal(sig);
      }
    } catch(e){}
  }, 1200);
}

async function handleSignal(sig){
  if (!call.pc) return;
  if (sig.type === 'offer' && call.role === 'callee' && !offerHandled){
    offerHandled = true;
    try {
      await call.pc.setRemoteDescription({ type:'offer', sdp: sig.sdp });
      const ans = await call.pc.createAnswer();
      await call.pc.setLocalDescription(ans);
      await postSignal({ type:'answer', sdp: ans.sdp });
      updateModal('Соединение...');
    } catch(e){ console.error('offer', e); }
    return;
  }
  if (sig.type === 'answer' && call.role === 'caller'){
    try { if (call.pc.signalingState !== 'stable') await call.pc.setRemoteDescription({ type:'answer', sdp: sig.sdp }); } catch(e){}
    return;
  }
  if (sig.type === 'ice'){ try { await call.pc.addIceCandidate(sig.candidate); } catch(e){} return; }
  if (sig.type === 'end'){ endCall(true); }
}

async function postSignal(data){
  try {
    data.from = state.me.id;
    await fetch('/api/signal', {
      method:'POST', headers:{'Content-Type':'application/json'}, credentials:'same-origin',
      body: JSON.stringify({ room: call.room, data })
    });
  } catch(e){}
}

async function acceptCall(){
  if (!canCall()){ alert('Этот браузер не поддерживает звонки'); endCall(true); return; }
  try { call.localStream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch(e){ alert('Нет доступа к микрофону: ' + e.message); endCall(true); return; }
  offerHandled = false;
  call.pc = newPc();
  call.localStream.getTracks().forEach(t => call.pc.addTrack(t, call.localStream));
  call.active = true;
  showCallModal('Соединение...', ['end']);
  startPolling();
}

async function endCall(){
  if (call.room){ try { await postSignal({ type:'end' }); } catch(e){} }
  clearInterval(call.pollTimer); call.pollTimer = null;
  if (call.pc){ try { call.pc.close(); } catch(e){} call.pc = null; }
  if (call.localStream){ call.localStream.getTracks().forEach(t => t.stop()); call.localStream = null; }
  if (call.remoteAudio){ call.remoteAudio.pause(); call.remoteAudio = null; }
  call.active = false; call.room = null; call.role = null;
  offerHandled = false;
  hideCallModal();
}

function showCallModal(text, buttons){
  hideCallModal();
  const box = el('div', {class:'modal'});
  box.appendChild(el('h3', {id:'callTitle', text: text}));
  const controls = el('div', {id:'callControls'});
  if (buttons.includes('accept')){
    const b = el('button', {class:'accept', type:'button', text:'Принять'});
    b.addEventListener('click', acceptCall); controls.appendChild(b);
  }
  if (buttons.includes('reject')){
    const b = el('button', {class:'reject', type:'button', text:'Отклонить'});
    b.addEventListener('click', () => endCall(true)); controls.appendChild(b);
  }
  if (buttons.includes('end')){
    const b = el('button', {class:'reject', type:'button', text:'Сбросить'});
    b.addEventListener('click', () => endCall(true)); controls.appendChild(b);
  }
  box.appendChild(controls);
  const slider = el('input', {type:'range', min:'0', max:'1', step:'0.05', value:'1'});
  slider.addEventListener('input', () => { if (call.remoteAudio) call.remoteAudio.volume = Number(slider.value); });
  box.appendChild(slider);
  const overlay = el('div', {class:'overlay', id:'callOverlay'}, [box]);
  document.body.appendChild(overlay);
  call.modal = overlay;
}
function updateModal(text){
  const t = document.getElementById('callTitle'); if (t) t.textContent = text;
  const controls = document.getElementById('callControls');
  if (controls && !controls.querySelector('.reject')){
    const b = el('button', {class:'reject', type:'button', text:'Сбросить'});
    b.addEventListener('click', () => endCall(true)); controls.appendChild(b);
  }
}
function hideCallModal(){ if (call.modal){ call.modal.remove(); call.modal = null; } }

/* ======== СТАРТ ======== */
(async function start(){
  try {
    const d = await api('/api/me');
    if (d.user){
      state.me = { id: d.user.id, username: d.user.username, avatar: d.user.avatar || '' };
      await renderApp();
    } else {
      renderAuth();
    }
  } catch(e){ renderAuth(); }
})();
</script>
