<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Messenger</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;font:15px system-ui;background:#eef1f5;color:#18202a;overscroll-behavior:none}
  button{font:inherit;cursor:pointer}
  input{font:inherit}
  .card{max-width:420px;margin:10vh auto;background:#fff;padding:28px;border-radius:18px;box-shadow:0 10px 40px #0001}
  .field{width:100%;padding:12px;border-radius:10px;border:1px solid #dce1e7;margin:6px 0}
  .primary{width:100%;padding:12px;border-radius:10px;border:0;background:#3678e8;color:#fff;margin:6px 0}
  .link{border:0;background:none;color:#3678e8;padding:0;margin:0}
  .error{color:#c33;min-height:20px;margin-top:8px}
  .app{height:100dvh;display:flex;max-width:1100px;margin:auto;background:#fff}
  .side{width:320px;border-right:1px solid #e5e8ec;padding:18px;display:flex;flex-direction:column;min-width:0;background:#fff}
  .side h2{margin:0;font-size:20px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
  .users{flex:1;overflow:auto;margin-top:10px;min-height:0;-webkit-overflow-scrolling:touch}
  .user{padding:10px;border-radius:10px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:10px;position:relative}
  .user:active{background:#edf3ff}
  .user.active{background:#edf3ff}
  .user b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .user .dot{position:absolute;left:33px;bottom:7px;width:11px;height:11px;border-radius:50%;background:#b8c0c8;border:2px solid #fff}
  .user .dot.on{background:#34c759}
  .avatar{width:36px;height:36px;border-radius:50%;background:#dbe4f0;display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto;overflow:hidden;background-size:cover;background-position:center}
  .avatar.small{width:32px;height:32px;font-size:18px}
  .me-bar{display:flex;align-items:center;gap:10px;padding:10px;background:#f4f7fc;border-radius:12px;margin-bottom:10px}
  .me-bar .name{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chat{flex:1;display:flex;flex-direction:column;min-width:0;background:#fff}
  .head{padding:12px 14px;border-bottom:1px solid #e5e8ec;font-weight:700;display:flex;align-items:center;gap:10px;min-height:56px}
  .head .row{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
  .head .col{display:flex;flex-direction:column;min-width:0}
  .head .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .head .sub{font-size:12px;color:#7b8490;font-weight:400}
  .head button.back{display:none;border:0;background:none;font-size:22px;padding:0 6px 0 0;cursor:pointer;line-height:1}
  .head button.call{border:0;background:#34a853;color:#fff;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;flex:0 0 auto}
  .msgs{flex:1;overflow:auto;padding:16px;background:#f7f9fb;min-height:0;-webkit-overflow-scrolling:touch}
  .brow{display:flex;margin:6px 0}
  .brow.out{justify-content:flex-end}
  .b{max-width:80%;padding:8px 12px;border-radius:15px;background:#e3e6ea;word-wrap:break-word;white-space:pre-wrap;font-size:15px;line-height:1.35;position:relative;cursor:pointer}
  .b.out{background:#c9ccd1}
  .b .meta{font-size:11px;color:#7b8490;margin-top:3px;display:flex;gap:4px;align-items:center;justify-content:flex-end}
  .b .meta .check{color:#4a90e2}
  .b audio{max-width:100%;margin-top:2px;display:block}
  .b .reacts{display:flex;gap:3px;margin-top:3px;flex-wrap:wrap}
  .b .reacts span{background:#fff;border:1px solid #e5e8ec;border-radius:10px;padding:1px 6px;font-size:12px}
  .compose-wrap{border-top:1px solid #e5e8ec;background:#fff}
  .compose{display:flex;padding:10px;gap:8px;align-items:center;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  .compose input{flex:1;padding:12px 14px;border:1px solid #ddd;border-radius:20px;min-width:0;font-size:16px}
  .compose button.icon{width:42px;height:42px;background:#eef1f5;color:#18202a;border:0;border-radius:50%;font-size:18px;flex:0 0 auto}
  .compose button.send{width:46px;height:46px;background:#3678e8;color:#fff;border:0;border-radius:50%;font-size:18px;flex:0 0 auto}
  .compose button.rec{background:#ea4335;color:#fff}
  .emoji-panel{display:none;padding:8px 10px;background:#fff;border-top:1px solid #eee;flex-wrap:wrap;gap:4px;max-height:180px;overflow:auto}
  .emoji-panel.open{display:flex}
  .emoji-panel button{background:#f4f6f9;border:0;border-radius:8px;font-size:22px;padding:6px;cursor:pointer;line-height:1}
  .emoji-panel button:hover{background:#e6eaf0}
  .typing{font-size:12px;color:#7b8490;padding:0 16px 6px;height:18px}
  .muted{color:#7b8490;padding:10px}
  .overlay{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px}
  .modal{background:#fff;border-radius:16px;padding:22px;max-width:420px;width:100%;text-align:center}
  .modal h3{margin:0 0 12px;font-size:18px}
  .modal button{padding:10px 20px;margin:6px;border-radius:10px;border:0;cursor:pointer;font-size:15px}
  .modal .accept{background:#34a853;color:#fff}
  .modal .reject{background:#ea4335;color:#fff}
  .modal input[type=range]{width:100%;margin-top:12px}
  .react-popup{position:fixed;background:#fff;border:1px solid #e5e8ec;border-radius:14px;padding:4px 6px;display:flex;gap:2px;box-shadow:0 6px 20px #0002;z-index:1100}
  .react-popup button{background:none;border:0;font-size:22px;padding:4px 6px;cursor:pointer;border-radius:8px}
  .react-popup button:hover{background:#f0f3f7}
  @media (max-width: 700px){
    .app{max-width:none;position:relative;overflow:hidden}
    .side{width:100%;border-right:0;padding:14px;padding-top:calc(14px + env(safe-area-inset-top))}
    .chat{position:absolute;inset:0;transform:translateX(100%);transition:transform .22s ease;z-index:5;background:#fff}
    .app.chat-open .chat{transform:translateX(0)}
    .head button.back{display:block}
    .b{max-width:85%}
    .card{margin:6vh 14px;padding:20px}
    .side h2{font-size:18px}
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";

const api = async (u, o = {}) => {
  const r = await fetch(u, {
    headers: {'Content-Type':'application/json'},
    credentials: 'same-origin',
    ...o
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw Error(d.error || 'Ошибка');
  return d;
};

const state = { me: null, peer: null, timer: null, typingSent: 0 };
const root = document.getElementById('root');
let appEl = null;
let typingLine = null;

const EMOJI_LIST = ('😀 😃 😄 😁 😆 😅 😂 🤣 😊 😇 🙂 🙃 😉 😌 😍 🥰 😘 😗 😙 😚 😋 😜 🤪 😝 🤗 🤔 🤨 😐 😑 😶 🙄 😏 😣 😥 😮 🤐 😯 😪 😴 😛 😕 😟 🙁 😞 😔 😢 😭 😤 😠 😡 🤬 🤯 😳 🥺 😱 😨 😰 😓 😩 😫 🥱 🤤 👋 👍 👎 👌 ✌️ 🤞 🤟 🤘 🤙 👈 👉 👆 👇 ☝️ ✋ 🤚 🖐️ 🖖 👏 🙌 👐 🤲 🤝 🙏 💪 ❤️ 🧡 💛 💚 💙 💜 🖤 🤍 🤎 💔 ❣️ 💕 💞 💓 💗 💖 💘 💝 💟 🔥 ✨ 🎉 🎊 🎁 🎈').split(/\s+/).filter(Boolean);

const REACT_LIST = ['👍','❤️','😂','🔥','😮','😢'];

function el(tag, props, children){
  const n = document.createElement(tag);
  if (props) for (const k in props){
    if (k === 'class') n.className = props[k];
    else if (k === 'text') n.textContent = props[k];
    else if (k === 'on') for (const ev in props[k]) n.addEventListener(ev, props[k][ev]);
    else if (k in n) n[k] = props[k];
    else n.setAttribute(k, props[k]);
  }
  if (children) for (const c of [].concat(children)){
    if (c == null || c === false) continue;
    n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return n;
}
function clear(n){ while (n.firstChild) n.removeChild(n.firstChild); }
function makeAvatar(u, size){
  const d = el('div', { class: 'avatar' + (size ? ' ' + size : '') });
  const a = (u && u.avatar) || '';
  if (a.startsWith('data:')) d.style.backgroundImage = 'url("' + a + '")';
  else if (a) d.textContent = a;
  else d.textContent = '👤';
  return d;
}
function isMobile(){ return window.matchMedia('(max-width: 700px)').matches; }
function fmtTime(ts){
  const d = new Date((ts || 0) * 1000);
  const h = String(d.getHours()).padStart(2,'0');
  const m = String(d.getMinutes()).padStart(2,'0');
  return h + ':' + m;
}

/* ======== АВТОРИЗАЦИЯ ======== */
function renderAuth(){
  clear(root);
  appEl = null;
  let reg = true;
  const modeEl = el('p', {class:'muted', style:{padding:'0'}, text:'Регистрация'});
  const inpU = el('input', {class:'field', placeholder:'Имя пользователя', autocomplete:'username'});
  const inpP = el('input', {class:'field', type:'password', placeholder:'Пароль', autocomplete:'current-password'});
  const errEl = el('div', {class:'error'});
  const btnGo = el('button', {class:'primary', type:'button', text:'Зарегистрироваться'});
  const btnSwap = el('button', {class:'link', type:'button', text:'У меня уже есть аккаунт'});

  btnSwap.addEventListener('click', () => {
    reg = !reg;
    modeEl.textContent = reg ? 'Регистрация' : 'Вход';
    btnGo.textContent = reg ? 'Зарегистрироваться' : 'Войти';
    btnSwap.textContent = reg ? 'У меня уже есть аккаунт' : 'Создать аккаунт';
    errEl.textContent = '';
  });
  btnGo.addEventListener('click', async () => {
    errEl.textContent = '';
    try {
      const d = await api(reg ? '/api/register' : '/api/login', {
        method:'POST',
        body: JSON.stringify({ username: inpU.value.trim(), password: inpP.value })
      });
      state.me = { id: d.id, username: d.username, avatar: d.avatar || '' };
      renderApp();
    } catch(e){ errEl.textContent = e.message; }
  });
  inpU.addEventListener('keydown', e => { if (e.key === 'Enter') inpP.focus(); });
  inpP.addEventListener('keydown', e => { if (e.key === 'Enter') btnGo.click(); });
  root.appendChild(el('div', {class:'card'}, [
    el('h1', {text:'Messenger'}), modeEl, inpU, inpP, btnGo, btnSwap, errEl
  ]));
}
/* ======== ОСНОВНОЙ ЭКРАН ======== */
async function renderApp(){
  clear(root);
  const usersBox = el('div', {class:'users'});
  const inpSearch = el('input', {class:'field', placeholder:'Поиск', autocomplete:'off'});
  const headTitle = el('div', {class:'name', text:'Выберите пользователя'});
  const headSub = el('div', {class:'sub', text:''});
  const headCol = el('div', {class:'col'}, [headTitle, headSub]);
  const headAva = el('div');
  const inpText = el('input', {placeholder:'Сообщение...', disabled:true, autocomplete:'off'});

  const btnBack = el('button', {class:'back', type:'button', text:'←', title:'Назад'});
  btnBack.addEventListener('click', () => {
    if (appEl) appEl.classList.remove('chat-open');
    state.peer = null;
    headTitle.textContent = 'Выберите пользователя';
    headSub.textContent = '';
    clear(headAva);
    inpText.disabled = true;
  });

  const btnCall = el('button', {class:'call', text:'📞', type:'button', title:'Позвонить'});
  btnCall.addEventListener('click', startCall);

  const headRow = el('div', {class:'row'}, [headAva, headCol]);
  const chatHead = el('div', {class:'head'}, [btnBack, headRow, btnCall]);
  const msgsBox = el('div', {class:'msgs'});
  typingLine = el('div', {class:'typing', text:''});

  const btnSend = el('button', {class:'send', type:'button', text:'➤'});
  const btnSmile = el('button', {class:'icon', type:'button', text:'😊'});
  const btnMic = el('button', {class:'icon', type:'button', text:'🎤'});

  const emojiPanel = el('div', {class:'emoji-panel'});
  for (const e of EMOJI_LIST){
    const b = el('button', {type:'button', text:e});
    b.addEventListener('click', () => { inpText.value += e; inpText.focus(); });
    emojiPanel.appendChild(b);
  }
  btnSmile.addEventListener('click', () => emojiPanel.classList.toggle('open'));

  let mediaRec = null, chunks = [], recStream = null;
  btnMic.addEventListener('click', async () => {
    if (mediaRec && mediaRec.state === 'recording'){ mediaRec.stop(); return; }
    if (!navigator.mediaDevices || !window.MediaRecorder){
      alert('Этот браузер не поддерживает запись звука');
      return;
    }
    try {
      recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      chunks = [];
      mediaRec = new MediaRecorder(recStream);
      mediaRec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
      mediaRec.onstop = async () => {
        recStream.getTracks().forEach(t => t.stop());
        btnMic.textContent = '🎤';
        btnMic.classList.remove('rec');
        const blob = new Blob(chunks, { type: 'audio/webm' });
        if (blob.size < 500) return;
        const reader = new FileReader();
        reader.onload = async () => {
          if (!state.peer) return;
          try {
            await api('/api/messages', {
              method:'POST',
              body: JSON.stringify({ receiver: state.peer.id, text: String(reader.result), kind: 'voice' })
            });
            await refresh(msgsBox);
          } catch(e){ alert(e.message); }
        };
        reader.readAsDataURL(blob);
      };
      mediaRec.start();
      btnMic.textContent = '⏹';
      btnMic.classList.add('rec');
    } catch(e){
      alert('Нет доступа к микрофону: ' + e.message);
    }
  });

  const btnOut = el('button', {class:'link', type:'button', text:'Выйти'});
  btnOut.addEventListener('click', async () => {
    await api('/api/logout', { method:'POST' }).catch(()=>{});
    state.me = null; state.peer = null;
    clearInterval(state.timer); state.timer = null;
    renderAuth();
  });
  const meBar = el('div', {class:'me-bar'}, [
    makeAvatar(state.me), el('div', {class:'name', text: state.me.username})
  ]);

  inpSearch.addEventListener('input', () =>
    loadUsers(usersBox, chatHead, headTitle, headAva, inpText, msgsBox, inpSearch.value));
  btnSend.addEventListener('click', () => send(inpText, msgsBox));
  inpText.addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); send(inpText, msgsBox); }
  });
  inpText.addEventListener('input', () => {
    if (!state.peer) return;
    const now = Date.now();
    if (now - state.typingSent > 2000){
      state.typingSent = now;
      api('/api/typing', { method:'POST', body: JSON.stringify({ to: state.peer.id }) }).catch(()=>{});
    }
  });

  appEl = el('div', {class:'app'}, [
    el('aside', {class:'side'}, [
      el('div', {class:'top'}, [el('h2', {text:'Друзья'}), btnOut]),
      meBar, inpSearch, usersBox
    ]),
    el('main', {class:'chat'}, [
      chatHead, msgsBox, typingLine,
      el('div', {class:'compose-wrap'}, [
        emojiPanel,
        el('div', {class:'compose'}, [btnSmile, inpText, btnMic, btnSend])
      ])
    ])
  ]);
  root.appendChild(appEl);
  loadUsers(usersBox, chatHead, headTitle, headAva, inpText, msgsBox, '');

  clearInterval(state.timer);
  state.timer = setInterval(async () => {
    if (!state.peer) return;
    await refresh(msgsBox);
    try {
      const d = await api('/api/typing?who=' + state.peer.id);
      typingLine.textContent = d.typing ? 'печатает…' : '';
    } catch(e){}
    try {
      const u = await api('/api/users?q=' + encodeURIComponent(state.peer.username));
      const found = (u.users || []).find(x => x.id === state.peer.id);
      if (found) headSub.textContent = found.online ? 'онлайн' : 'не в сети';
    } catch(e){}
  }, 2000);
}
async function loadUsers(usersBox, chatHead, headTitle, headAva, inpText, msgsBox, q){
  try {
    const d = await api('/api/users?q=' + encodeURIComponent(q || ''));
    clear(usersBox);
    if (!d.users.length){
      usersBox.appendChild(el('div', {class:'muted', text:'Никого не найдено'}));
      return;
    }
    for (const u of d.users){
      const active = state.peer && state.peer.id === u.id;
      const av = makeAvatar(u, 'small');
      const dot = el('div', {class:'dot' + (u.online ? ' on' : '')});
      const wrap = el('div', {});
      wrap.appendChild(el('b', {text: u.username}));
      const item = el('div', {class:'user' + (active ? ' active' : '')}, [av, wrap, dot]);
      item.addEventListener('click', () => openChat(u, usersBox, chatHead, headTitle, headAva, inpText, msgsBox));
      usersBox.appendChild(item);
    }
  } catch(e){ console.error(e); }
}

async function openChat(user, usersBox, chatHead, headTitle, headAva, inpText, msgsBox){
  state.peer = { id: user.id, username: user.username, avatar: user.avatar };
  headTitle.textContent = user.username;
  clear(headAva);
  headAva.appendChild(makeAvatar(user, 'small'));
  inpText.disabled = false;
  inpText.focus();
  await refresh(msgsBox);
  if (isMobile() && appEl) appEl.classList.add('chat-open');
}

async function refresh(msgsBox){
  if (!state.peer) return;
  try {
    const d = await api('/api/messages/' + state.peer.id);
    clear(msgsBox);
    if (!d.messages.length){
      msgsBox.appendChild(el('div', {class:'muted', text:'Сообщений пока нет'}));
      return;
    }
    for (const m of d.messages){
      msgsBox.appendChild(renderMessage(m));
    }
    msgsBox.scrollTop = msgsBox.scrollHeight;
  } catch(e){ console.error(e); }
}

function renderMessage(m){
  const out = m.sender === state.me.id;
  const b = el('div', {class: 'b' + (out ? ' out' : '')});
  if (m.kind === 'voice'){
    const audio = el('audio', {controls:true, src: m.text});
    b.appendChild(audio);
  } else {
    b.appendChild(document.createTextNode(m.text));
  }
  const meta = el('div', {class:'meta'});
  meta.appendChild(document.createTextNode(fmtTime(m.created)));
  if (out){
    meta.appendChild(el('span', {class:'check', text: m.read_at ? '✓✓' : '✓'}));
  }
  b.appendChild(meta);
  if (m.reactions && m.reactions.length){
    const rw = el('div', {class:'reacts'});
    for (const r of m.reactions){
      rw.appendChild(el('span', {text: r.emoji}));
    }
    b.appendChild(rw);
  }
  b.addEventListener('contextmenu', (e) => { e.preventDefault(); showReactPopup(e.clientX, e.clientY, m, msgsBox); });
  let touchTimer;
  b.addEventListener('touchstart', () => { touchTimer = setTimeout(() => showReactPopup(100, 200, m, msgsBox), 600); });
  b.addEventListener('touchend', () => clearTimeout(touchTimer));
  return el('div', {class:'brow' + (out ? ' out' : '')}, [b]);
}

function showReactPopup(x, y, m, msgsBox){
  document.querySelectorAll('.react-popup').forEach(n => n.remove());
  const p = el('div', {class:'react-popup'});
  p.style.left = Math.max(8, x - 100) + 'px';
  p.style.top = Math.max(8, y - 50) + 'px';
  for (const e of REACT_LIST){
    const b = el('button', {type:'button', text:e});
    b.addEventListener('click', async () => {
      await api('/api/react', { method:'POST', body: JSON.stringify({ message_id: m.id, emoji: e })});
      p.remove();
      await refresh(msgsBox);
    });
    p.appendChild(b);
  }
  document.body.appendChild(p);
  setTimeout(() => { document.addEventListener('click', function h(){ p.remove(); document.removeEventListener('click', h); }); }, 0);
}

async function send(inpText, msgsBox){
  if (!state.peer) return;
  const text = inpText.value.trim();
  if (!text) return;
  try {
    await api('/api/messages', {
      method:'POST',
      body: JSON.stringify({ receiver: state.peer.id, text, kind: 'text' })
    });
    inpText.value = '';
    await refresh(msgsBox);
  } catch(e){ alert(e.message); }
}

/* ======== ЗВОНКИ ======== */
const call = { active:false, pc:null, localStream:null, remoteAudio:null, room:null, role:null, pollTimer:null, modal:null };

function canCall(){
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.RTCPeerConnection);
}
function getIceServers(){
  return [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' }
  ];
}
function newPc(){
  const pc = new RTCPeerConnection({ iceServers: getIceServers() });
  pc.onicecandidate = (ev) => { if (ev.candidate) postSignal({ type:'ice', candidate: ev.candidate.toJSON() }); };
  pc.ontrack = (ev) => {
    if (!call.remoteAudio){ call.remoteAudio = new Audio(); call.remoteAudio.autoplay = true; }
    call.remoteAudio.srcObject = ev.streams[0];
    call.remoteAudio.play().catch(()=>{});
  };
  pc.oniceconnectionstatechange = () => {
    const s = pc.iceConnectionState;
    if (s === 'connected' || s === 'completed') updateModal('В разговоре');
    if (s === 'disconnected' || s === 'failed' || s === 'closed') endCall(true);
  };
  return pc;
}

async function startCall(){
  if (!state.peer) return alert('Сначала выберите пользователя');
  if (call.active) return alert('Звонок уже идёт');
  if (!canCall()) return alert('Этот браузер не поддерживает звонки');

  call.room = Math.random().toString(36).substring(2, 10);
  call.role = 'caller';
  call.active = true;

  try {
    call.localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch(e){
    alert('Нет доступа к микрофону: ' + e.message);
    call.active = false;
    return;
  }
  call.pc = newPc();
  call.localStream.getTracks().forEach(t => call.pc.addTrack(t, call.localStream));
  const offer = await call.pc.createOffer();
  await call.pc.setLocalDescription(offer);
  await postSignal({ type:'offer', sdp: offer.sdp });
  showCallModal('Ожидание ответа...', ['end']);
  try {
    await api('/api/call/invite', { method:'POST', body: JSON.stringify({ to: state.peer.id, room: call.room })});
  } catch(e){}
  const link = location.origin + location.pathname + '#call-' + call.room;
  try {
    await api('/api/messages', { method:'POST', body: JSON.stringify({ receiver: state.peer.id, text: '📞 Звонок: ' + link, kind: 'text' })});
  } catch(e){}
  startPolling();
}

setInterval(async () => {
  if (!state.me || call.active) return;
  try {
    const r = await fetch('/api/call/incoming', { credentials:'same-origin' });
    const d = await r.json();
    if (d.invite){
      call.room = d.invite.room;
      call.role = 'callee';
      showCallModal('Входящий звонок от ' + d.invite.fromName, ['accept', 'reject']);
    }
  } catch(e){}
}, 2000);

function startPolling(){
  clearInterval(call.pollTimer);
  call.pollTimer = setInterval(async () => {
    if (!call.active || !call.room) return;
    try {
      const r = await fetch('/api/signal/' + call.room, { credentials:'same-origin' });
      const d = await r.json();
      if (!d.items || !d.items.length) return;
      for (const sig of d.items) await handleSignal(sig);
    } catch(e){}
  }, 1200);
}

async function handleSignal(sig){
  if (!call.pc) return;
  if (sig.type === 'offer' && call.role === 'callee'){
    try {
      await call.pc.setRemoteDescription({ type:'offer', sdp: sig.sdp });
      const ans = await call.pc.createAnswer();
      await call.pc.setLocalDescription(ans);
      await postSignal({ type:'answer', sdp: ans.sdp });
      updateModal('Соединение...');
    } catch(e){}
  } else if (sig.type === 'answer' && call.role === 'caller'){
    try { if (call.pc.signalingState !== 'stable') await call.pc.setRemoteDescription({ type:'answer', sdp: sig.sdp }); } catch(e){}
  } else if (sig.type === 'ice'){
    try { await call.pc.addIceCandidate(sig.candidate); } catch(e){}
  } else if (sig.type === 'end'){
    endCall(true);
  }
}
async function postSignal(data){
  try {
    await fetch('/api/signal', {
      method:'POST',
      headers: {'Content-Type':'application/json'},
      credentials:'same-origin',
      body: JSON.stringify({ room: call.room, data })
    });
  } catch(e){}
}
async function acceptCall(){
  if (!canCall()){ alert('Этот браузер не поддерживает звонки'); endCall(true); return; }
  try {
    call.localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch(e){ alert('Нет доступа к микрофону: ' + e.message); endCall(true); return; }
  call.pc = newPc();
  call.localStream.getTracks().forEach(t => call.pc.addTrack(t, call.localStream));
  call.active = true;
  showCallModal('Соединение...', ['end']);
  startPolling();
}
async function endCall(){
  if (call.room){ try { await postSignal({ type:'end' }); } catch(e){} }
  clearInterval(call.pollTimer); call.pollTimer = null;
  if (call.pc){ try { call.pc.close(); } catch(e){} call.pc = null; }
  if (call.localStream){ call.localStream.getTracks().forEach(t => t.stop()); call.localStream = null; }
  if (call.remoteAudio){ call.remoteAudio.pause(); call.remoteAudio = null; }
  call.active = false; call.room = null; call.role = null;
  hideCallModal();
  if (location.hash.startsWith('#call-')) location.hash = '';
}
function showCallModal(text, buttons){
  hideCallModal();
  const box = el('div', {class:'modal'});
  box.appendChild(el('h3', {id:'callTitle', text: text}));
  const controls = el('div', {id:'callControls'});
  if (buttons.includes('accept')){
    const b = el('button', {class:'accept', type:'button', text:'Принять'});
    b.addEventListener('click', acceptCall);
    controls.appendChild(b);
  }
  if (buttons.includes('reject')){
    const b = el('button', {class:'reject', type:'button', text:'Отклонить'});
    b.addEventListener('click', () => endCall(true));
    controls.appendChild(b);
  }
  if (buttons.includes('end')){
    const b = el('button', {class:'reject', type:'button', text:'Сбросить'});
    b.addEventListener('click', () => endCall(true));
    controls.appendChild(b);
  }
  box.appendChild(controls);
  const slider = el('input', {type:'range', min:'0', max:'1', step:'0.05', value:'1'});
  slider.addEventListener('input', () => {
    if (call.remoteAudio) call.remoteAudio.volume = Number(slider.value);
  });
  box.appendChild(slider);
  const overlay = el('div', {class:'overlay', id:'callOverlay'}, [box]);
  document.body.appendChild(overlay);
  call.modal = overlay;
}
function updateModal(text){
  const t = document.getElementById('callTitle');
  if (t) t.textContent = text;
  const controls = document.getElementById('callControls');
  if (controls && !controls.querySelector('.reject')){
    const b = el('button', {class:'reject', type:'button', text:'Сбросить'});
    b.addEventListener('click', () => endCall(true));
    controls.appendChild(b);
  }
}
function hideCallModal(){
  if (call.modal){ call.modal.remove(); call.modal = null; }
}
function checkIncomingFromHash(){
  const h = location.hash;
  if (!h.startsWith('#call-')) return;
  const room = h.substring(6);
  if (!room) return;
  call.room = room;
  call.role = 'callee';
  showCallModal('Входящий звонок...', ['accept', 'reject']);
}
(async function start(){
  try {
    const d = await api('/api/me');
    if (d.user){
      state.me = { id: d.user.id, username: d.user.username, avatar: d.user.avatar || '' };
      await renderApp();
      checkIncomingFromHash();
    } else {
      renderAuth();
    }
  } catch(e){
    renderAuth();
  }
})();
</script>
</body>
