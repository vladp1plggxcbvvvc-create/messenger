<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Messenger</title>
<style>
  :root{
    --bg:#0f1115; --bg2:#151922; --bg3:#1c2230; --line:#242c3d;
    --txt:#e6e9ef; --dim:#8b93a7; --acc:#4c8dff; --acc2:#6ea8ff;
    --ok:#3ddc84; --warn:#ffb020; --err:#ff5c5c; --radius:12px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%; margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--txt); overflow:hidden;
    display:flex; flex-direction:column;
  }
  button{font-family:inherit; cursor:pointer}
  input,textarea{font-family:inherit}
  .hidden{display:none !important}

  #auth{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(1200px 600px at 50% -10%, #1b2a4a 0%, var(--bg) 60%);
    z-index:50; padding:16px;
  }
  .auth-card{
    width:100%; max-width:380px; background:var(--bg2); border:1px solid var(--line);
    border-radius:16px; padding:24px; box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .auth-card h1{margin:0 0 4px; font-size:22px}
  .auth-card p{margin:0 0 18px; color:var(--dim); font-size:13px}
  .field{margin-bottom:12px}
  .field label{display:block; font-size:12px; color:var(--dim); margin-bottom:6px}
  .field input{
    width:100%; padding:11px 12px; background:var(--bg3); border:1px solid var(--line);
    border-radius:10px; color:var(--txt); font-size:15px; outline:none;
  }
  .field input:focus{border-color:var(--acc)}
  .btn{
    width:100%; padding:12px; border:none; border-radius:10px; font-size:15px;
    font-weight:600; background:var(--acc); color:#fff;
  }
  .btn:active{transform:scale(.99)}
  .btn.ghost{background:transparent; border:1px solid var(--line); color:var(--txt)}
  .btn.small{width:auto; padding:8px 12px; font-size:13px}
  .switch{text-align:center; margin-top:14px; font-size:13px; color:var(--dim)}
  .switch a{color:var(--acc2); text-decoration:none; cursor:pointer}
  .err{color:var(--err); font-size:13px; min-height:18px; margin-top:8px; text-align:center}

  #app{flex:1; display:flex; flex-direction:column; min-height:0}
  header.top{
    display:flex; align-items:center; gap:10px; padding:10px 14px;
    background:var(--bg2); border-bottom:1px solid var(--line); flex:0 0 auto;
  }
  header.top .title{font-weight:700; font-size:16px; flex:1; display:flex; align-items:center; gap:8px}
  .badge{
    background:var(--err); color:#fff; font-size:11px; font-weight:700;
    border-radius:10px; padding:1px 6px; min-width:18px; text-align:center;
  }
  .icon-btn{
    background:transparent; border:none; color:var(--dim); font-size:18px;
    padding:6px; border-radius:8px; line-height:1;
  }
  .icon-btn:active{background:var(--bg3)}

  .tabs{display:flex; background:var(--bg2); border-bottom:1px solid var(--line); flex:0 0 auto}
  .tab{
    flex:1; padding:11px 8px; text-align:center; font-size:14px; color:var(--dim);
    background:transparent; border:none; border-bottom:2px solid transparent;
  }
  .tab.active{color:var(--txt); border-bottom-color:var(--acc); font-weight:600}

  .content{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; min-height:0}
  .pane{padding:8px}

  .searchbar{padding:8px 8px 0}
  .searchbar input{
    width:100%; padding:10px 12px; background:var(--bg3); border:1px solid var(--line);
    border-radius:10px; color:var(--txt); font-size:14px; outline:none;
  }

  .list{display:flex; flex-direction:column; gap:2px; padding:8px}
  .row{
    display:flex; align-items:center; gap:10px; padding:10px; border-radius:10px;
    background:transparent; border:none; text-align:left; width:100%; color:var(--txt);
  }
  .row:active{background:var(--bg3)}
  .row.pinned{background:rgba(76,141,255,.08)}
  .avatar{
    width:44px; height:44px; border-radius:50%; background:var(--bg3); flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; font-size:20px; overflow:hidden;
    position:relative;
  }
  .avatar img{width:100%; height:100%; object-fit:cover}
  .dot{
    width:10px; height:10px; border-radius:50%; background:var(--ok);
    position:absolute; right:-1px; bottom:-1px; border:2px solid var(--bg2);
  }
  .row .meta{flex:1; min-width:0}
  .row .name{font-size:15px; font-weight:600; display:flex; align-items:center; gap:6px}
  .row .name .muted-ico{font-size:12px; color:var(--dim)}
  .row .prev{
    font-size:13px; color:var(--dim); white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; margin-top:2px;
  }
  .row .side{display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex:0 0 auto}
  .row .time{font-size:11px; color:var(--dim)}
  .row .unread{
    background:var(--acc); color:#fff; font-size:11px; font-weight:700;
    border-radius:10px; padding:1px 7px; min-width:18px; text-align:center;
  }
  .empty{padding:40px 20px; text-align:center; color:var(--dim); font-size:14px}
  .section-title{padding:12px 12px 6px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim)}

  #chat{position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column; z-index:30}
  .chat-head{
    display:flex; align-items:center; gap:10px; padding:10px 12px;
    background:var(--bg2); border-bottom:1px solid var(--line); flex:0 0 auto;
  }
  .chat-head .meta{flex:1; min-width:0}
  .chat-head .name{font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .chat-head .status{font-size:12px; color:var(--dim)}
  .chat-head .status.online{color:var(--ok)}
  .messages{
    flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:12px;
    display:flex; flex-direction:column; gap:6px; min-height:0;
  }
  .msg{
    max-width:78%; padding:8px 11px; border-radius:14px; font-size:14px; line-height:1.35;
    word-wrap:break-word; white-space:pre-wrap; position:relative;
  }
  .msg.me{align-self:flex-end; background:var(--acc); color:#fff; border-bottom-right-radius:4px}
  .msg.other{align-self:flex-start; background:var(--bg3); border-bottom-left-radius:4px}
  .msg .mtime{font-size:10px; opacity:.7; margin-top:3px; text-align:right}
  .msg .reply{
    font-size:12px; opacity:.85; border-left:2px solid currentColor; padding-left:6px;
    margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .msg.deleted{opacity:.5; font-style:italic}
  .msg .edited{font-size:10px; opacity:.7; margin-left:4px}
  .msg .reacts{display:flex; gap:4px; flex-wrap:wrap; margin-top:4px}
  .msg .react{
    background:rgba(255,255,255,.15); border-radius:10px; padding:0 6px; font-size:12px;
    display:flex; align-items:center; gap:3px; cursor:pointer;
  }
  .msg.me .react{background:rgba(0,0,0,.18)}
  .sender-tag{font-weight:600}
  .typing{font-size:12px; color:var(--dim); padding:0 12px 6px; min-height:16px}
  .composer{
    display:flex; gap:8px; padding:10px 12px; background:var(--bg2);
    border-top:1px solid var(--line); flex:0 0 auto; align-items:flex-end;
  }
  .composer textarea{
    flex:1; resize:none; max-height:120px; min-height:38px; padding:9px 11px;
    background:var(--bg3); border:1px solid var(--line); border-radius:10px;
    color:var(--txt); font-size:14px; outline:none; line-height:1.3;
  }
  .composer textarea:focus{border-color:var(--acc)}
  .send{
    width:42px; height:38px; border:none; border-radius:10px; background:var(--acc);
    color:#fff; font-size:18px; flex:0 0 auto;
  }

  .modal{
    position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:40;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .sheet{
    width:100%; max-width:520px; background:var(--bg2); border:1px solid var(--line);
    border-radius:16px 16px 0 0; padding:18px; max-height:80vh; overflow-y:auto;
  }
  .sheet h3{margin:0 0 12px; font-size:17px}
  .sheet .kv{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px}
  .sheet .kv:last-child{border-bottom:none}
  .sheet .kv .k{color:var(--dim)}
  .sheet .actions{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap}
  .sheet .actions .btn{flex:1; min-width:120px}
  .danger{color:var(--err); border-color:rgba(255,92,92,.5) !important}
  .pinned-ico{font-size:12px; color:var(--acc2)}

  @media(min-width:760px){
    .pane{max-width:720px; margin:0 auto}
    #chat{max-width:760px; margin:0 auto; border-left:1px solid var(--line); border-right:1px solid var(--line)}
  }
</style>
</head>
<body>

<div id="auth">
  <div class="auth-card">
    <h1 id="authTitle">Вход</h1>
    <p id="authSub">Мессенджер. Локально. Без лишнего.</p>
    <div class="field">
      <label>Имя</label>
      <input id="inUser" autocomplete="username" placeholder="nickname" maxlength="32">
    </div>
    <div class="field">
      <label>Пароль</label>
      <input id="inPass" type="password" autocomplete="current-password" placeholder="••••••" maxlength="64">
    </div>
    <button class="btn" id="btnAuth">Войти</button>
    <div class="switch">
      <span id="switchText">Нет аккаунта?</span>
      <a id="switchLink">Регистрация</a>
    </div>
    <div class="err" id="authErr"></div>
  </div>
</div>

<div id="app" class="hidden">
  <header class="top">
    <div class="title">
      <span id="appTitle">Диалоги</span>
      <span class="badge hidden" id="totalBadge">0</span>
    </div>
    <button class="icon-btn" id="btnSearchAll" title="Поиск по всем">🔍</button>
    <button class="icon-btn" id="btnProfile" title="Профиль">👤</button>
    <button class="icon-btn" id="btnLogout" title="Выйти">⎋</button>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="dialogs">Диалоги</button>
    <button class="tab" data-tab="people">Люди</button>
    <button class="tab" data-tab="groups">Группы</button>
  </div>

  <div class="content" id="content">
    <div class="pane" id="paneDialogs">
      <div class="list" id="listDialogs"></div>
    </div>
    <div class="pane hidden" id="panePeople">
      <div class="searchbar"><input id="peopleSearch" placeholder="Поиск людей…"></div>
      <div class="list" id="listPeople"></div>
    </div>
    <div class="pane hidden" id="paneGroups">
      <div class="list" id="listGroups"></div>
      <div style="padding:8px">
        <button class="btn ghost small" id="btnCreateGroup">+ Создать группу</button>
      </div>
    </div>
  </div>
</div>

<div id="chat" class="hidden">
  <div class="chat-head">
    <button class="icon-btn" id="chatBack">←</button>
    <div class="avatar" id="chatAvatar">💬</div>
    <div class="meta">
      <div class="name" id="chatName">Чат</div>
      <div class="status" id="chatStatus"></div>
    </div>
    <button class="icon-btn" id="chatProfile" title="Профиль">ℹ️</button>
    <button class="icon-btn" id="chatMore" title="Ещё">⋮</button>
  </div>
  <div class="messages" id="messages"></div>
  <div class="typing" id="typingLine"></div>
  <div class="composer">
    <textarea id="msgInput" rows="1" placeholder="Сообщение…" maxlength="4096"></textarea>
    <button class="send" id="btnSend">➤</button>
  </div>
</div>

<div class="modal hidden" id="modal">
  <div class="sheet" id="sheet"></div>
</div><script>
"use strict";

const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => Array.from(el.querySelectorAll(s));

let ME = null;
let state = {
  tab: "dialogs",
  dialogs: [],
  people: [],
  groups: [],
  current: null,
  messages: [],
  totalUnread: 0,
};
let timers = {};
let chatPoll = null;

async function api(path, opts={}){
  const o = Object.assign({headers:{}}, opts);
  if (o.body && typeof o.body !== "string"){
    o.headers["Content-Type"] = "application/json";
    o.body = JSON.stringify(o.body);
  }
  const r = await fetch(path, o);
  let data = null;
  try{ data = await r.json(); }catch(e){}
  if (!r.ok){
    const msg = (data && (data.error || data.message)) || ("HTTP " + r.status);
    const err = new Error(msg); err.status = r.status; err.data = data;
    throw err;
  }
  return data;
}

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function fmtTime(ts){
  if (!ts) return "";
  const d = new Date(ts * 1000);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) return d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
  const y = new Date(now); y.setDate(now.getDate()-1);
  if (d.toDateString() === y.toDateString()) return "вчера";
  return d.toLocaleDateString([], {day:"2-digit", month:"2-digit"});
}
function fmtFullTime(ts){
  if (!ts) return "";
  return new Date(ts*1000).toLocaleString([], {hour:"2-digit", minute:"2-digit", day:"2-digit", month:"2-digit"});
}
function lastSeenText(ts, online){
  if (online) return "в сети";
  if (!ts) return "был(а) давно";
  const diff = Math.floor(Date.now()/1000 - ts);
  if (diff < 60) return "был(а) только что";
  if (diff < 3600) return "был(а) " + Math.floor(diff/60) + " мин назад";
  if (diff < 86400) return "был(а) " + Math.floor(diff/3600) + " ч назад";
  return "был(а) " + fmtFullTime(ts);
}
function avatarHTML(av, fallback){
  if (av && (av.startsWith("http") || av.startsWith("data:") || av.startsWith("/"))){
    return '<img src="'+esc(av)+'" alt="">';
  }
  return esc(av || fallback || "👤");
}
function toast(msg){
  console.warn("[toast]", msg);
}

let authMode = "login";
function setAuthMode(m){
  authMode = m;
  $("#authTitle").textContent = m === "login" ? "Вход" : "Регистрация";
  $("#authSub").textContent = m === "login" ? "Мессенджер. Локально. Без лишнего." : "Создай аккаунт за 5 секунд.";
  $("#btnAuth").textContent = m === "login" ? "Войти" : "Создать аккаунт";
  $("#switchText").textContent = m === "login" ? "Нет аккаунта?" : "Уже есть аккаунт?";
  $("#switchLink").textContent = m === "login" ? "Регистрация" : "Вход";
  $("#authErr").textContent = "";
}
$("#switchLink").addEventListener("click", () => setAuthMode(authMode === "login" ? "register" : "login"));
$("#btnAuth").addEventListener("click", doAuth);
$("#inPass").addEventListener("keydown", e => { if (e.key === "Enter") doAuth(); });
$("#inUser").addEventListener("keydown", e => { if (e.key === "Enter") $("#inPass").focus(); });

async function doAuth(){
  const username = $("#inUser").value.trim();
  const password = $("#inPass").value;
  $("#authErr").textContent = "";
  if (!username || !password){ $("#authErr").textContent = "Заполни имя и пароль."; return; }
  try{
    const path = authMode === "login" ? "/api/login" : "/api/register";
    await api(path, {method:"POST", body:{username, password}});
    await bootAfterAuth();
  }catch(e){
    $("#authErr").textContent = e.message || "Ошибка";
  }
}

async function bootAfterAuth(){
  const r = await api("/api/me");
  if (!r.user){ showAuth(); return; }
  ME = r.user;
  $("#auth").classList.add("hidden");
  $("#app").classList.remove("hidden");
  setAuthMode("login");
  await refreshAll();
  startPolling();
  ensureAdminButton();
}

function showAuth(){
  ME = null;
  $("#app").classList.add("hidden");
  $("#chat").classList.add("hidden");
  $("#auth").classList.remove("hidden");
  stopPolling();
  stopChatPolling();
}

$("#btnLogout").addEventListener("click", async () => {
  try{ await api("/api/logout", {method:"POST"}); }catch(e){}
  showAuth();
});

$$(".tab").forEach(t => t.addEventListener("click", () => switchTab(t.dataset.tab)));
function switchTab(tab){
  state.tab = tab;
  $$(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === tab));
  $("#paneDialogs").classList.toggle("hidden", tab !== "dialogs");
  $("#panePeople").classList.toggle("hidden", tab !== "people");
  $("#paneGroups").classList.toggle("hidden", tab !== "groups");
  const titles = {dialogs:"Диалоги", people:"Люди", groups:"Группы"};
  $("#appTitle").textContent = titles[tab] || "Диалоги";
  if (tab === "people") loadPeople();
  if (tab === "groups") loadGroups();
}

async function loadDialogs(){
  try{
    const r = await api("/api/dialogs");
    state.dialogs = r.dialogs || [];
    renderDialogs();
  }catch(e){ console.warn(e); }
}
function renderDialogs(){
  const el = $("#listDialogs");
  if (!state.dialogs.length){
    el.innerHTML = '<div class="empty">Пока нет диалогов.<br>Открой вкладку «Люди» и напиши кому-нибудь.</div>';
    return;
  }
  const pinned = state.dialogs.filter(d => d.pinned);
  const rest = state.dialogs.filter(d => !d.pinned);
  let html = "";
  if (pinned.length){
    html += '<div class="section-title">Закреплённые</div>';
    html += pinned.map(dialogRowHTML).join("");
  }
  if (rest.length){
    if (pinned.length) html += '<div class="section-title">Все</div>';
    html += rest.map(dialogRowHTML).join("");
  }
  el.innerHTML = html;
  $$(".row[data-dialog]", el).forEach(row => {
    row.addEventListener("click", () => openDM(Number(row.dataset.dialog)));
  });
}
function dialogRowHTML(d){
  const av = avatarHTML(d.avatar, (d.username||"?").slice(0,1).toUpperCase());
  const online = d.online ? '<span class="dot"></span>' : '';
  const muted = d.muted ? '<span class="muted-ico">🔕</span>' : '';
  const unread = d.unread > 0 ? '<span class="unread">'+d.unread+'</span>' : '';
  return `
    <button class="row ${d.pinned?'pinned':''}" data-dialog="${d.id}">
      <div class="avatar">${av}${online}</div>
      <div class="meta">
        <div class="name">${esc(d.username)} ${muted}</div>
        <div class="prev">${esc(d.preview || "—")}</div>
      </div>
      <div class="side">
        <div class="time">${fmtTime(d.created)}</div>
        ${unread}
      </div>
    </button>`;
}

let peopleSearchTimer = null;
$("#peopleSearch").addEventListener("input", () => {
  clearTimeout(peopleSearchTimer);
  peopleSearchTimer = setTimeout(loadPeople, 250);
});
async function loadPeople(){
  const q = $("#peopleSearch").value.trim();
  try{
    const r = await api("/api/users?q=" + encodeURIComponent(q));
    state.people = r.users || [];
    renderPeople();
  }catch(e){ console.warn(e); }
}
function renderPeople(){
  const el = $("#listPeople");
  if (!state.people.length){
    el.innerHTML = '<div class="empty">Никого не найдено.</div>';
    return;
  }
  el.innerHTML = state.people.map(u => {
    const av = avatarHTML(u.avatar, (u.username||"?").slice(0,1).toUpperCase());
    const online = u.online ? '<span class="dot"></span>' : '';
    return `
      <button class="row" data-person="${u.id}">
        <div class="avatar">${av}${online}</div>
        <div class="meta">
          <div class="name">${esc(u.username)}</div>
          <div class="prev">${u.online ? "в сети" : lastSeenText(u.last_seen, false)}</div>
        </div>
      </button>`;
  }).join("");
  $$(".row[data-person]", el).forEach(row => {
    row.addEventListener("click", () => openDM(Number(row.dataset.person)));
  });
}

async function loadGroups(){
  try{
    const r = await api("/api/groups");
    state.groups = r.groups || [];
    renderGroups();
  }catch(e){ console.warn(e); }
}
function renderGroups(){
  const el = $("#listGroups");
  if (!state.groups.length){
    el.innerHTML = '<div class="empty">Пока нет групп. Создай первую.</div>';
    return;
  }
  el.innerHTML = state.groups.map(g => {
    return `
      <button class="row" data-group="${g.id}">
        <div class="avatar">👥</div>
        <div class="meta">
          <div class="name">${esc(g.name)}</div>
          <div class="prev">${(g.members||[]).length} участник(ов)</div>
        </div>
      </button>`;
  }).join("");
  $$(".row[data-group]", el).forEach(row => {
    row.addEventListener("click", () => openGroup(Number(row.dataset.group)));
  });
}
$("#btnCreateGroup").addEventListener("click", () => {
  openSheet("Новая группа", `
    <div class="field"><label>Название</label><input id="gName" maxlength="32" placeholder="Например, «Друзья»"></div>
    <div class="actions">
      <button class="btn ghost" id="gCancel">Отмена</button>
      <button class="btn" id="gCreate">Создать</button>
    </div>
    <div class="err" id="gErr"></div>
  `, () => {
    $("#gCancel").onclick = closeModal;
    $("#gCreate").onclick = async () => {
      const name = $("#gName").value.trim();
      if (name.length < 2){ $("#gErr").textContent = "Минимум 2 символа."; return; }
      try{
        await api("/api/groups", {method:"POST", body:{name, members:[]}});

async function loadMessages(){
  if (!state.current) return;
  const c = state.current;
  try{
    let r;
    if (c.type === "dm") r = await api("/api/messages/" + c.id);
    else r = await api("/api/groups/" + c.id + "/messages");
    state.messages = r.messages || [];
    renderMessages();
  }catch(e){ console.warn(e); }
}
function renderMessages(){
  const el = $("#messages");
  if (!state.messages.length){
    el.innerHTML = '<div class="empty">Сообщений пока нет. Напиши первым.</div>';
    return;
  }
  el.innerHTML = state.messages.map(m => messageHTML(m)).join("");
  scrollBottom();
}
function messageHTML(m){
  const mine = m.sender === (ME && ME.id);
  const cls = "msg " + (mine ? "me" : "other") + (m.deleted ? " deleted" : "");
  let reply = "";
  if (m.reply_to && m.reply_text){
    reply = '<div class="reply">'+esc(m.reply_name || "?")+": "+esc(m.reply_text)+'</div>';
  }
  let body;
  if (m.deleted) body = "сообщение удалено";
  else if (m.kind === "image") body = '<div>🖼 <span style="opacity:.8">картинка</span></div>';
  else if (m.kind === "sticker") body = '<div style="font-size:32px">'+esc(m.text)+'</div>';
  else body = esc(m.text);
  let reacts = "";
  if (m.reactions && m.reactions.length){
    const groups = {};
    m.reactions.forEach(r => { groups[r.emoji] = (groups[r.emoji]||0)+1; });
    reacts = '<div class="reacts">' + Object.keys(groups).map(e =>
      '<span class="react" data-emoji="'+esc(e)+'">'+esc(e)+' '+groups[e]+'</span>').join("") + '</div>';
  }
  const edited = m.edited ? '<span class="edited">(изм.)</span>' : '';
  const senderTag = (state.current && state.current.type === "group" && !mine && m.sender_name)
    ? '<div class="sender-tag" style="font-size:11px;color:var(--acc2);margin-bottom:2px">'+esc(m.sender_name)+'</div>'
    : '';
  return `<div class="${cls}" data-mid="${m.id}">
    ${senderTag}${reply}${body}${edited}${reacts}
    <div class="mtime">${fmtTime(m.created)}</div>
  </div>`;
}
function scrollBottom(){
  const el = $("#messages");
  el.scrollTop = el.scrollHeight;
}

$("#btnSend").addEventListener("click", sendMessage);
$("#msgInput").addEventListener("keydown", e => {

});
$("#msgInput").addEventListener("input", () => {

  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 120) + "px";
  sendTyping();
});
let typingSentAt = 0;
function sendTyping(){
  if (!state.current) return;
  const now = Date.now();
  if (now - typingSentAt < 2500) return;
  typingSentAt = now;
  const body = state.current.type === "dm" ? {to: state.current.id} : {group: state.current.id};
  api("/api/typing", {method:"POST", body}).catch(()=>{});
}

async function sendMessage(){
  if (!state.current) return;
  const input = $("#msgInput");
  const text = input.value.trim();
  if (!text) return;
  const c = state.current;
  try{
    let r;
    if (c.type === "dm"){
      r = await api("/api/messages", {method:"POST", body:{receiver: c.id, text}});
    } else {
      r = await api("/api/groups/" + c.id + "/messages", {method:"POST", body:{text}});
    }
    input.value = "";
    input.style.height = "auto";
    state.messages.push(r.message);
    renderMessages();
    await loadDialogs();
  }catch(e){ toast(e.message); }
}

function startPolling(){

function stopPolling(){

function startChatPolling(){
  if (chatPoll) clearInterval(chatPoll);
  chatPoll = setInterval(async () => {
    if (!state.current) return;
    await loadMessages();
    await pollTyping();
    if (state.current.type === "dm"){
      try{
        const p = await api("/api/user/" + state.current.id);
        const u = p.user;
        state.current.online = u.online;
        $("#chatStatus").textContent = lastSeenText(u.last_seen, u.online);
        $("#chatStatus").classList.toggle("online", !!u.online);
      }catch(e){}
    } else {
      const g = state.groups.find(x => x.id === state.current.id);
      if (g) $("#chatStatus").textContent = (g.members||[]).length + " участник(ов)";
    }
  }, 3000);
}
function stopChatPolling(){
  if (chatPoll){ clearInterval(chatPoll); chatPoll = null; }
}
async function pollTyping(){
  if (!state.current) return;
  const c = state.current;
  try{
    let r;
    if (c.type === "dm") r = await api("/api/typing?who=" + c.id);

}

          <div class="meta">
            <div class="name">${esc(c.username)}</div>
            <div class="prev">${esc(c.preview||"—")}</div>
          </div>
          <div class="side"><div class="time">${fmtTime(c.last_created)}</div></div>
        </div>
      `).join("");
      $$("[data-aum-peer]", body).forEach(el => {
        el.onclick = () => adminUserDialog(uid, Number(el.dataset.aumPeer));
      });
    }catch(e){ body.innerHTML = '<div class="err">'+esc(e.message)+'</div>'; }
  });
}

async function adminUserDialog(uid, other){
  openSheet("Диалог #" + uid + " ↔ #" + other, `<div id="audBody" class="empty">Загрузка…</div>`, async () => {
    const body = $("#audBody");
    try{
      const r = await api("/api/admin/user-messages/" + uid + "/" + other);
      if (!r.messages.length){ body.innerHTML = '<div class="empty">Пусто.</div>'; return; }
      body.innerHTML = r.messages.map(m => {
        const mine = m.sender === uid;
        const cls = "msg " + (mine ? "me" : "other") + (m.deleted ? " deleted" : "");
        const bodyText = m.deleted ? "сообщение удалено" : esc(m.text);
        return `<div class="${cls}" style="max-width:100%">
          <div style="font-size:11px;opacity:.7">#${m.sender} → #${m.receiver}</div>
          <div>${bodyText}</div>
          <div class="mtime">${fmtFullTime(m.created)}</div>
        </div>`;
      }).join("");
    }catch(e){ body.innerHTML = '<div class="err">'+esc(e.message)+'</div>'; }
  });
}

async function tryBecomeAdmin(){
  const code = prompt("Код админа:");
  if (!code) return;
  try{
    await api("/api/admin/secret", {method:"POST", body:{code}});
    const r = await api("/api/me");
    ME = r.user;
    ensureAdminButton();
    toast("Теперь ты админ.");
  }catch(e){ toast(e.message); }
}

document.addEventListener("keydown", e => {
  if (e.ctrlKey && e.shiftKey && (e.key === "A" || e.key === "a")){
    e.preventDefault();
    tryBecomeAdmin();
    return;
  }
  if (e.key === "Escape"){
    if (!$("#modal").classList.contains("hidden")) { closeModal(); return; }
    if (!$("#chat").classList.contains("hidden")) { $("#chatBack").click(); return; }
  }
  if (e.key === "/" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA"){
    e.preventDefault();
    if (state.tab === "people") $("#peopleSearch").focus();
    else $("#btnSearchAll").click();
  }
});

async function refreshAll(){
  await loadDialogs();
  pollUnreadTotal();
  if (state.tab === "people") loadPeople();
  if (state.tab === "groups") loadGroups();
}

async function openStickerPacks(){
  openSheet("Стикер-паки", `
    <div class="actions" style="margin-bottom:10px">
      <button class="btn ghost" id="spNew">+ Новый пак</button>
    </div>
    <div id="spBody" class="empty">Загрузка…</div>
    <div class="actions"><button class="btn ghost" id="spClose">Закрыть</button></div>
  `, async () => {
    $("#spClose").onclick = closeModal;
    $("#spNew").onclick = () => createStickerPack();
    await loadStickerPacks();
  });
}

async function loadStickerPacks(){
  const box = $("#spBody");
  try{
    const r = await api("/api/sticker-packs");
    if (!r.packs.length){ box.innerHTML = '<div class="empty">Пока нет паков.</div>'; return; }
    box.innerHTML = r.packs.map(p => `
      <div class="kv" style="align-items:flex-start; flex-direction:column; gap:6px">
        <div style="display:flex; justify-content:space-between; width:100%">
          <b>${esc(p.name)}</b>
          <button class="btn ghost small" data-sp-add="${p.id}">+ стикер</button>
        </div>
        <div style="display:flex; gap:6px; flex-wrap:wrap">
          ${(p.stickers||[]).map(s => `
            <span data-sticker="${esc(s.image)}" style="font-size:28px;cursor:pointer;padding:4px;background:var(--bg3);border-radius:8px">
              ${s.image.startsWith("http")||s.image.startsWith("data:") ? '<img src="'+esc(s.image)+'" style="width:32px;height:32px;object-fit:contain">' : esc(s.image)}
            </span>`).join("") || '<span style="color:var(--dim);font-size:12px">пусто</span>'}
        </div>
      </div>
    `).join("");
    $$("[data-sp-add]", box).forEach(el => {
      el.onclick = () => addStickerToPack(Number(el.dataset.spAdd));
    });
    $$("[data-sticker]", box).forEach(el => {
      el.onclick = () => sendSticker(el.dataset.sticker);
    });
  }catch(e){ box.innerHTML = '<div class="err">'+esc(e.message)+'</div>'; }
}

async function createStickerPack(){
  const name = prompt("Название пака:");
  if (!name || name.trim().length < 2) return;
  try{
    await api("/api/sticker-packs", {method:"POST", body:{name: name.trim()}});
    await loadStickerPacks();
  }catch(e){ toast(e.message); }
}

async function addStickerToPack(pid){
  const image = prompt("Стикер (эмодзи или URL/data:image):");
  if (!image) return;
  try{
    await api("/api/sticker-packs/" + pid + "/stickers", {method:"POST", body:{image}});
    await loadStickerPacks();
  }catch(e){ toast(e.message); }
}

async function sendSticker(image){
  if (!state.current) return;
  const c = state.current;
  try{
    let r;
    if (c.type === "dm"){
      r = await api("/api/messages", {method:"POST", body:{receiver: c.id, text: image, kind:"sticker"}});
    } else {
      r = await api("/api/groups/" + c.id + "/messages", {method:"POST", body:{text: image, kind:"sticker"}});
    }
    state.messages.push(r.message);
    renderMessages();
    closeModal();
  }catch(e){ toast(e.message); }
}

(function addStickerButton(){
  const composer = $(".composer");
  if (!composer || $("#btnStickers")) return;
  const b = document.createElement("button");
  b.className = "icon-btn";
  b.id = "btnStickers";
  b.title = "Стикеры";
  b.textContent = "🧩";
  b.style.fontSize = "20px";
  b.addEventListener("click", openStickerPacks);
  composer.insertBefore(b, composer.firstChild);
})();

let callState = { active:false, room:null, peer:null, poll:null };

async function startCall(){
  if (!state.current) return;
  if (state.current.type !== "dm"){ toast("Звонки только в личных чатах"); return; }
  const room = "r" + Math.random().toString(36).slice(2, 10);
  callState.active = true;
  callState.room = room;
  callState.peer = state.current.id;
  try{
    await api("/api/call/invite", {method:"POST", body:{to: state.current.id, room}});
    openCallUI("Исходящий звонок…", "Ждём ответа", true);
    startCallPolling();
  }catch(e){ toast(e.message); stopCall(); }
}

function openCallUI(title, sub, outgoing){
  openSheet("Звонок", `
    <div style="text-align:center; padding:20px 0">
      <div style="font-size:48px; margin-bottom:8px">📞</div>
      <div style="font-size:16px; font-weight:700" id="callTitle">${esc(title)}</div>
      <div style="color:var(--dim); font-size:13px; margin-top:4px" id="callSub">${esc(sub)}</div>
      <div class="actions" style="justify-content:center; margin-top:20px">
        ${outgoing ? '<button class="btn ghost danger" id="callHang">Отменить</button>' : ''}
      </div>
    </div>
  `, () => {
    const h = $("#callHang");
    if (h) h.onclick = stopCall;
  });
}

function startCallPolling(){
  if (callState.poll) clearInterval(callState.poll);
  callState.poll = setInterval(async () => {
    if (!callState.active) return;
    try{
      const r = await api("/api/signal/" + callState.room);
      if (r.items && r.items.length){
        $("#callTitle").textContent = "Соединено";
        $("#callSub").textContent = "Сигналинг работает";
      }
    }catch(e){}
  }, 2000);
}

function stopCall(){
  callState.active = false;
  if (callState.poll){ clearInterval(callState.poll); callState.poll = null; }
  callState.room = null;
  callState.peer = null;
  closeModal();
}

(function addCallButton(){
  const head = $(".chat-head");
  if (!head || $("#btnCall")) return;
  const b = document.createElement("button");
  b.className = "icon-btn";
  b.id = "btnCall";
  b.title = "Позвонить";
  b.textContent = "📞";
  b.addEventListener("click", startCall);
  $("#chatProfile").before(b);
})();

setInterval(async () => {
  if (!ME) return;
  try{
    const r = await api("/api/call/incoming");
    if (r.invite){
      const inv = r.invite;
      openSheet("Входящий звонок", `
        <div style="text-align:center; padding:20px 0">
          <div style="font-size:48px; margin-bottom:8px">📞</div>
          <div style="font-size:16px; font-weight:700">${esc(inv.fromName || "?")}</div>
          <div style="color:var(--dim); font-size:13px; margin-top:4px">входящий звонок</div>
          <div class="actions" style="justify-content:center; margin-top:20px">
            <button class="btn ghost danger" id="incReject">Отклонить</button>
            <button class="btn" id="incAccept">Принять</button>
          </div>
        </div>
      `, () => {
        $("#incReject").onclick = () => { closeModal(); };
        $("#incAccept").onclick = () => {
          callState.active = true;
          callState.room = inv.room;
          callState.peer = inv.from;
          openCallUI("Соединено", "Сигналинг работает", true);
          startCallPolling();
        };
      });
    }
  }catch(e){}
}, 4000);

(async function init(){
  setAuthMode("login");
  try{
    const r = await api("/api/me");
    if (r.user){ await bootAfterAuth(); }
    else showAuth();
  }catch(e){ showAuth(); }
})();
</script>
</body>
</html>
