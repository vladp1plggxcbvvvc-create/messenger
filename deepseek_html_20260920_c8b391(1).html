<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Messenger</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font:15px system-ui;background:#eef1f5;color:#18202a}
  button{font:inherit;cursor:pointer}
  input{font:inherit}

  .card{max-width:420px;margin:10vh auto;background:#fff;padding:28px;border-radius:18px;box-shadow:0 10px 40px #0001}
  .card h1{margin:0 0 12px}
  .field{width:100%;padding:12px;border-radius:10px;border:1px solid #dce1e7;margin:6px 0}
  .primary{width:100%;padding:12px;border-radius:10px;border:0;background:#3678e8;color:#fff;margin:6px 0}
  .link{border:0;background:none;color:#3678e8;padding:0;margin:0}
  .error{color:#c33;min-height:20px;margin-top:8px}

  .app{height:100vh;display:flex;max-width:1100px;margin:auto;background:#fff}
  .side{width:320px;border-right:1px solid #e5e8ec;padding:18px;display:flex;flex-direction:column;min-width:0}
  .side h2{margin:0}
  .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
  .users{flex:1;overflow:auto;margin-top:10px;min-height:0}
  .user{padding:9px 10px;border-radius:10px;cursor:pointer;user-select:none;display:flex;align-items:center;gap:10px}
  .user:hover{background:#edf3ff}
  .user.active{background:#edf3ff}
  .user b{font-weight:600}
  .hl{background:#ffe89a;border-radius:3px;padding:0 2px}

  .avatar{width:36px;height:36px;border-radius:50%;background:#dbe4f0;display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto;overflow:hidden;background-size:cover;background-position:center}
  .avatar.small{width:28px;height:28px;font-size:16px}
  .avatar.big{width:56px;height:56px;font-size:30px}
  .avatar.clickable{cursor:pointer}

  .me-bar{display:flex;align-items:center;gap:10px;padding:10px;background:#f4f7fc;border-radius:12px;margin-bottom:10px}
  .me-bar .name{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .chat{flex:1;display:flex;flex-direction:column;min-width:0}
  .head{padding:12px 18px;border-bottom:1px solid #e5e8ec;font-weight:700}
  .head .row{display:flex;align-items:center;gap:10px}
  .msgs{flex:1;overflow:auto;padding:20px;background:#f7f9fb;min-height:0}
  .b{max-width:70%;padding:10px 13px;margin:7px 0;border-radius:15px;background:#e3e6ea;color:#18202a;word-wrap:break-word;white-space:pre-wrap}
  .b.out{margin-left:auto;background:#c9ccd1}

  .compose{display:flex;padding:12px;border-top:1px solid #e5e8ec;gap:8px}
  .compose input{flex:1;padding:12px;border:1px solid #ddd;border-radius:20px;min-width:0}
  .compose button{width:48px;background:#3678e8;color:#fff;border:0;border-radius:50%}
  .muted{color:#7b8490;padding:10px}

  .overlay{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal{background:#fff;border-radius:16px;padding:22px;max-width:460px;width:100%;max-height:90vh;overflow:auto}
  .emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:16px}
  .emoji-grid button{aspect-ratio:1;border:1px solid #e5e8ec;background:#fff;border-radius:10px;font-size:22px;padding:0}
  .modal .actions{display:flex;justify-content:space-between;gap:8px;margin-top:6px}
  .modal .actions button{padding:10px 14px;border-radius:10px;border:1px solid #dce1e7;background:#fff}
</style>
</head>
<body>
<div id="root"></div>
<script>
const api = async (u, o = {}) => {
  const r = await fetch(u, { headers: {'Content-Type':'application/json'}, credentials:'same-origin', ...o });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw Error(d.error || 'Ошибка');
  return d;
};

const EMOJI = ['😀','😎','🤖','👽','🐱','🐶','🦊','🐼','🐸','🦁','🐯','🐨','🐵','🦄','🐲','🐧','🍎','🍕','🍔','🍩','🍓','🍉','⚽','🎮','🚀','🌟','🔥','💎','🎧','🎨','🧠','👑'];

const state = { me: null, users: [], peer: null, timer: null };
const root = document.getElementById('root');

function el(tag, props, children){
  const n = document.createElement(tag);
  if (props) for (const k in props){
    if (k === 'class') n.className = props[k];
    else if (k === 'text') n.textContent = props[k];
    else if (k === 'on') for (const ev in props[k]) n.addEventListener(ev, props[k][ev]);
    else if (k in n) n[k] = props[k];
    else n.setAttribute(k, props[k]);
  }
  if (children) for (const c of [].concat(children)){
    if (c == null || c === false) continue;
    n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return n;
}
function clear(n){ while (n.firstChild) n.removeChild(n.firstChild); }

function makeAvatar(u, size, onClick){
  const cls = 'avatar' + (size ? ' ' + size : '') + (onClick ? ' clickable' : '');
  const d = el('div', { class: cls });
  const a = (u && u.avatar) || '';
  if (a.startsWith('data:')) d.style.backgroundImage = `url("${a}")`;
  else if (a) d.textContent = a;
  else d.textContent = '👤';
  if (onClick) d.addEventListener('click', onClick);
  return d;
}

function renderAuth(){
  clear(root);
  let reg = true;
  const modeEl = el('p', {class:'muted', style:{padding:'0'}, text:'Регистрация'});
  const inpU = el('input', {class:'field', placeholder:'Имя пользователя'});
  const inpP = el('input', {class:'field', type:'password', placeholder:'Пароль'});
  const errEl = el('div', {class:'error'});
  const btnGo = el('button', {class:'primary', type:'button', text:'Зарегистрироваться'});
  const btnSwap = el('button', {class:'link', type:'button', text:'У меня уже есть аккаунт'});

  btnSwap.addEventListener('click', () => {
    reg = !reg;
    modeEl.textContent = reg ? 'Регистрация' : 'Вход';
    btnGo.textContent = reg ? 'Зарегистрироваться' : 'Войти';
    btnSwap.textContent = reg ? 'У меня уже есть аккаунт' : 'Создать аккаунт';
    errEl.textContent = '';
  });

  btnGo.addEventListener('click', async () => {
    errEl.textContent = '';
    try {
      const d = await api(reg ? '/api/register' : '/api/login', {
        method:'POST',
        body: JSON.stringify({ username: inpU.value.trim(), password: inpP.value })
      });
      state.me = { id: d.id, username: d.username, avatar: d.avatar || '' };
      renderApp();
    } catch(e){ errEl.textContent = e.message; }
  });

  root.appendChild(el('div', {class:'card'}, [
    el('h1', {text:'Messenger'}),
    modeEl, inpU, inpP, btnGo, btnSwap, errEl
  ]));
}

async function renderApp(){
  clear(root);

  const usersBox = el('div', {class:'users'});
  const inpSearch = el('input', {class:'field', placeholder:'Поиск', autocomplete:'off'});
  const headTitle = el('div', {text:'Выберите пользователя'});
  const headAva = el('div');
  const chatHead = el('div', {class:'head'}, [ el('div', {class:'row'}, [headAva, headTitle]) ]);
  const msgsBox = el('div', {class:'msgs'});
  const inpText = el('input', {placeholder:'Сообщение...', disabled:true, autocomplete:'off'});
  const btnSend = el('button', {type:'button', text:'➤'});

  const btnOut = el('button', {class:'link', type:'button', text:'Выйти'});
  btnOut.addEventListener('click', async () => {
    await api('/api/logout', { method:'POST' }).catch(()=>{});
    state.me = null; state.peer = null;
    clearInterval(state.timer); state.timer = null;
    renderAuth();
  });

  const meAvatar = makeAvatar(state.me, '', () => openAvatarModal(() => renderApp()));
  const meName = el('div', {class:'name', text: state.me.username});
  const meBar = el('div', {class:'me-bar'}, [meAvatar, meName]);

  inpSearch.addEventListener('input', () => loadUsers(usersBox, chatHead, headTitle, headAva, inpText, msgsBox, inpSearch.value));
  btnSend.addEventListener('click', () => send(inpText, msgsBox));
  inpText.addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); send(inpText, msgsBox); }
  });

  root.appendChild(el('div', {class:'app'}, [
    el('aside', {class:'side'}, [
      el('div', {class:'top'}, [ el('h2', {text:'Друзья'}), btnOut ]),
      meBar, inpSearch, usersBox
    ]),
    el('main', {class:'chat'}, [ chatHead, msgsBox, el('div', {class:'compose'}, [inpText, btnSend]) ])
  ]));

  loadUsers(usersBox, chatHead, headTitle, headAva, inpText, msgsBox, '');

  clearInterval(state.timer);
  state.timer = setInterval(() => {
    if (state.peer) refresh(msgsBox);
  }, 1500);
}

async function loadUsers(usersBox, chatHead, headTitle, headAva, inpText, msgsBox, q){
  try {
    const d = await api('/api/users?q=' + encodeURIComponent(q || ''));
    state.users = d.users;
    clear(usersBox);
    if (!d.users.length){
      usersBox.appendChild(el('div', {class:'muted', text:'Никого не найдено'}));
      return;
    }
    for (const u of d.users){
      const active = state.peer && state.peer.id === u.id;
      const av = makeAvatar(u, 'small');
      const nameWrap = el('div', {});
      nameWrap.appendChild(el('b', {text: u.username}));
      const item = el('div', {class:'user' + (active ? ' active' : '')}, [av, nameWrap]);
      item.addEventListener('click', () => openChat(u, usersBox, chatHead, headTitle, headAva, inpText, msgsBox));
      usersBox.appendChild(item);
    }
  } catch(e){
    console.error(e);
  }
}

async function openChat(user, usersBox, chatHead, headTitle, headAva, inpText, msgsBox){
  state.peer = { id: user.id, username: user.username, avatar: user.avatar };
  headTitle.textContent = user.username;
  clear(headAva);
  headAva.appendChild(makeAvatar(user, 'small'));
  inpText.disabled = false;
  inpText.focus();
  await refresh(msgsBox);
}

async function refresh(msgsBox){
  if (!state.peer) return;
  try {
    const d = await api('/api/messages/' + state.peer.id);
    const meId = state.me.id;
    clear(msgsBox);
    if (!d.messages.length){
      msgsBox.appendChild(el('div', {class:'muted', text:'Сообщений пока нет'}));
      return;
    }
    for (const m of d.messages){
      msgsBox.appendChild(el('div', {
        class: 'b' + (m.sender === meId ? ' out' : ''),
        text: m.text
      }));
    }
    msgsBox.scrollTop = msgsBox.scrollHeight;
  } catch(e){ console.error(e); }
}

async function send(inpText, msgsBox){
  if (!state.peer) return;
  const text = inpText.value.trim();
  if (!text) return;
  try {
    await api('/api/messages', {
      method:'POST',
      body: JSON.stringify({ receiver: state.peer.id, text })
    });
    inpText.value = '';
    await refresh(msgsBox);
  } catch(e){ alert(e.message); }
}

function openAvatarModal(onDone){
  const overlay = el('div', {class:'overlay'});
  const close = () => overlay.remove();
  const grid = el('div', {class:'emoji-grid'});
  for (const e of EMOJI){
    const b = el('button', {type:'button', text:e});
    b.addEventListener('click', async () => {
      await api('/api/avatar', { method:'POST', body: JSON.stringify({ avatar: e }) });
      state.me.avatar = e;
      close(); onDone && onDone();
    });
    grid.appendChild(b);
  }
  overlay.appendChild(el('div', {class:'modal'}, [
    el('h3', {text:'Аватар'}),
    grid,
    el('div', {class:'actions'}, [
      el('button', {type:'button', text:'Закрыть', on:{click: close}})
    ])
  ]));
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  document.body.appendChild(overlay);
}

(async function start(){
  try {
    const d = await api('/api/me');
    if (d.user){
      state.me = { id: d.user.id, username: d.user.username, avatar: d.user.avatar || '' };
      renderApp();
    } else renderAuth();
  } catch(e){ renderAuth(); }
})();
</script>
</body>
</html>
